<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Painel</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;background:#0A0A0B;color:#F5F0E8;font-family:Arial,Helvetica,sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:34px 20px}
h1{font-family:Georgia,serif;font-style:italic;font-size:30px;margin:0 0 4px;color:#fff}
.sub{color:#B8922A;font-size:14px;margin-bottom:22px}
.card{background:#141416;border:1px solid #2C2C30;border-radius:12px;padding:16px 18px;margin-bottom:12px}
.top{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;align-items:baseline;margin-bottom:10px}
.nm{font-weight:800;font-size:19px;color:#fff}
.val{font-weight:800;font-size:19px;color:#B8922A}
.meta{color:#C9C5BC;font-size:14px;margin-bottom:14px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.bv{cursor:pointer;border:1px solid #8A6E1E;background:transparent;color:#E8C558;font-weight:700;font-size:14px;padding:10px 16px;border-radius:8px}
.bc{cursor:pointer;border:none;background:#25D366;color:#0A1628;font-weight:800;font-size:14px;padding:10px 16px;border-radius:8px}
.empty{color:#9A968C;font-size:15px}
</style>
</head>
<body>
<div class="wrap">
<h1>Inscrições — Confirmação</h1>
<div class="sub" id="count">carregando...</div>
<div id="list">Carregando...</div>
</div>
<script>window.__CFG={url:"https://uzghezeaxysdsgzpmejp.supabase.co",key:"sb_publishable_SLv9hMsbMxAs7643nF6NJA_d8PNBBlV"};</script>
<script>
(function(){
  var C=null, listBox=null, countEl=null;
  function waLink(phone,nome){ var d=String(phone||"").replace(/\D/g,""); if(d.length>0&&d.charAt(0)!=="5")d="55"+d; var msg="Fala, "+(nome||"")+"! Sua vaga no Kart Experience 3a Edicao esta CONFIRMADA. Dia 22/09 (ter), 19h, no Kart Point - Arena Mane Garrincha. Chegue antes das 19h pro briefing. Qualquer coisa e so chamar aqui. Bora aceleraaar!"; return "https://wa.me/"+d+"?text="+encodeURIComponent(msg); }
  function tick(){ var n=listBox.querySelectorAll("[data-rv]").length; countEl.textContent=n+" aguardando"; if(n===0){ listBox.innerHTML="<p class=\"empty\">Nenhuma inscricao aguardando confirmacao.</p>"; } }
  function verComp(rv){ if(!rv.comprovante_path){ alert("Sem comprovante."); return; } C.storage.from("comprovantes").createSignedUrl(rv.comprovante_path,3600).then(function(r){ if(r.data&&r.data.signedUrl){ window.open(r.data.signedUrl,"_blank"); } else { alert("Erro ao abrir comprovante."); } }); }
  function confirmar(rv,el){ window.open(waLink(rv.whatsapp,rv.nome),"_blank"); C.from("kart_reservas").update({status:"confirmado"}).eq("id",rv.id).then(function(r){ if(r.error){ alert("Erro ao confirmar: "+r.error.message); return; } if(rv.comprovante_path){ C.storage.from("comprovantes").remove([rv.comprovante_path]); } el.remove(); tick(); }); }
  function card(rv){ var d=document.createElement("div"); d.className="card"; d.setAttribute("data-rv","1"); var t=document.createElement("div"); t.className="top"; var nm=document.createElement("div"); nm.className="nm"; nm.textContent=rv.nome||"(sem nome)"; var v=document.createElement("div"); v.className="val"; v.textContent="R$"+(rv.valor_total||0); t.appendChild(nm); t.appendChild(v); d.appendChild(t); var m=document.createElement("div"); m.className="meta"; m.textContent=(rv.bateria==="feminina"?"Feminina":"Geral")+" - "+(rv.qtd_baterias||1)+" bateria(s) - WhatsApp: "+(rv.whatsapp||"-"); d.appendChild(m); var row=document.createElement("div"); row.className="row"; var bv=document.createElement("button"); bv.className="bv"; bv.textContent="Ver comprovante"; bv.onclick=function(){verComp(rv);}; var bc=document.createElement("button"); bc.className="bc"; bc.textContent="Confirmar no WhatsApp"; bc.onclick=function(){ if(confirm("Confirmar a vaga de "+(rv.nome||"")+"? Avisa no WhatsApp e apaga o comprovante.")){ confirmar(rv,d); } }; row.appendChild(bv); row.appendChild(bc); d.appendChild(row); return d; }
  function load(){ C.from("kart_reservas").select("*").eq("status","aguardando").order("created_at",{ascending:true}).then(function(r){ if(r.error){ listBox.textContent="Erro: "+r.error.message; countEl.textContent=""; return; } var data=r.data||[]; listBox.innerHTML=""; if(!data.length){ tick(); return; } data.forEach(function(rv){ listBox.appendChild(card(rv)); }); tick(); }); }
  function start(){ if(!window.supabase||!window.supabase.createClient){ setTimeout(start,100); return; } C=window.supabase.createClient(window.__CFG.url,window.__CFG.key); listBox=document.getElementById("list"); countEl=document.getElementById("count"); load(); }
  start();
})();
</script>
</body>
</html>
