<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Painel</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;background:#0A0A0B;color:#F5F0E8;font-family:Arial,Helvetica,sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:34px 20px}
h1{font-family:Georgia,serif;font-style:italic;font-size:30px;margin:0 0 4px;color:#fff}
.sub{color:#B8922A;font-size:14px;margin-bottom:22px}
.card{background:#141416;border:1px solid #2C2C30;border-radius:12px;padding:16px 18px;margin-bottom:12px}
.top{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;align-items:baseline;margin-bottom:10px}
.nm{font-weight:800;font-size:19px;color:#fff}
.val{font-weight:800;font-size:19px;color:#B8922A}
.meta{color:#C9C5BC;font-size:14px;margin-bottom:14px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.bv{cursor:pointer;border:1px solid #8A6E1E;background:transparent;color:#E8C558;font-weight:700;font-size:14px;padding:10px 16px;border-radius:8px}
.bc{cursor:pointer;border:none;background:#25D366;color:#0A1628;font-weight:800;font-size:14px;padding:10px 16px;border-radius:8px}
.empty{color:#9A968C;font-size:15px}
</style>
</head>
<body>
<div class="wrap">
<h1>Inscrições — Confirmação</h1>
<div class="sub" id="count">carregando...</div>
<div id="list">Carregando...</div>
<h1 style="margin-top:44px">Confirmados <span style="color:#B8922A;font-size:15px;font-style:normal">(por peso — pra montar as baterias)</span></h1>
<div class="sub" id="countC"></div>
<div id="listC"></div>
</div>
<script>window.__CFG={url:"https://uzghezeaxysdsgzpmejp.supabase.co",key:"sb_publishable_SLv9hMsbMxAs7643nF6NJA_d8PNBBlV"};</script>
<script>
(function(){
  var C=null, aBox, cBox, aCount, cCount, wmap={};
  function el(t,c,x){ var e=document.createElement(t); if(c)e.className=c; if(x!=null)e.textContent=x; return e; }
  function waLink(phone,nome){ var d=String(phone||"").replace(/\D/g,""); if(d.length>0&&d.charAt(0)!=="5")d="55"+d; var msg="Fala, "+(nome||"")+"! Sua vaga no Kart Experience 3a Edicao esta CONFIRMADA. Dia 22/09 (ter), 19h, no Kart Point - Arena Mane Garrincha. Chegue antes das 19h pro briefing. Qualquer coisa e so chamar aqui. Bora aceleraaar!"; return "https://wa.me/"+d+"?text="+encodeURIComponent(msg); }
  function verComp(rv){ if(!rv.comprovante_path){ alert("Sem comprovante."); return; } C.storage.from("comprovantes").createSignedUrl(rv.comprovante_path,3600).then(function(r){ if(r.data&&r.data.signedUrl){ window.open(r.data.signedUrl,"_blank"); } else { alert("Erro ao abrir comprovante."); } }); }
  function confirmar(rv){ window.open(waLink(rv.whatsapp,rv.nome),"_blank"); C.from("kart_reservas").update({status:"confirmado"}).eq("id",rv.id).then(function(r){ if(r.error){ alert("Erro ao confirmar: "+r.error.message); return; } if(rv.comprovante_path){ C.storage.from("comprovantes").remove([rv.comprovante_path]); } loadAll(); }); }
  function pesoTxt(nome){ var w=wmap[(nome||"").trim()]; return (w==null||w==="")?"-":(w+" kg"); }
  function cardAg(rv){ var d=el("div","card"); var t=el("div","top"); t.appendChild(el("div","nm",rv.nome||"(sem nome)")); t.appendChild(el("div","val","R$"+(rv.valor_total||0))); d.appendChild(t); d.appendChild(el("div","meta",(rv.bateria==="feminina"?"Feminina":"Geral")+" - "+(rv.qtd_baterias||1)+" bateria(s) - Peso: "+pesoTxt(rv.nome)+" - WhatsApp: "+(rv.whatsapp||"-"))); var row=el("div","row"); var bv=el("button","bv","Ver comprovante"); bv.onclick=function(){verComp(rv);}; var bc=el("button","bc","Confirmar no WhatsApp"); bc.onclick=function(){ if(confirm("Confirmar a vaga de "+(rv.nome||"")+"? Avisa no WhatsApp e apaga o comprovante.")){ confirmar(rv); } }; row.appendChild(bv); row.appendChild(bc); d.appendChild(row); return d; }
  function cardConf(rv){ var d=el("div","card"); var t=el("div","top"); t.appendChild(el("div","nm",rv.nome||"(sem nome)")); t.appendChild(el("div","val",pesoTxt(rv.nome))); d.appendChild(t); d.appendChild(el("div","meta",(rv.bateria==="feminina"?"Feminina":"Geral")+" - "+(rv.qtd_baterias||1)+" bateria(s) - R$"+(rv.valor_total||0)+" - WhatsApp: "+(rv.whatsapp||"-"))); return d; }
  function loadAll(){
    C.from("kart_pilotos_pub").select("full_name,weight_kg").then(function(pr){
      wmap={}; (pr.data||[]).forEach(function(p){ wmap[(p.full_name||"").trim()]=p.weight_kg; });
      C.from("kart_reservas").select("*").order("created_at",{ascending:true}).then(function(r){
        if(r.error){ aBox.textContent="Erro: "+r.error.message; return; }
        var all=r.data||[];
        var ag=all.filter(function(x){return x.status==="aguardando";});
        var cf=all.filter(function(x){return x.status==="confirmado";});
        cf.sort(function(a,b){ var wa=wmap[(a.nome||"").trim()], wb=wmap[(b.nome||"").trim()]; if(wa==null&&wb==null)return 0; if(wa==null)return 1; if(wb==null)return -1; return wa-wb; });
        aBox.innerHTML=""; aCount.textContent=ag.length+" aguardando";
        if(!ag.length){ aBox.innerHTML="<p class=\"empty\">Nenhuma aguardando confirmacao.</p>"; } else { ag.forEach(function(rv){ aBox.appendChild(cardAg(rv)); }); }
        cBox.innerHTML=""; cCount.textContent=cf.length+" confirmado(s)";
        if(!cf.length){ cBox.innerHTML="<p class=\"empty\">Ninguem confirmado ainda.</p>"; } else { cf.forEach(function(rv){ cBox.appendChild(cardConf(rv)); }); }
      });
    });
  }
  function start(){ if(!window.supabase||!window.supabase.createClient){ setTimeout(start,100); return; } C=window.supabase.createClient(window.__CFG.url,window.__CFG.key); aBox=document.getElementById("list"); cBox=document.getElementById("listC"); aCount=document.getElementById("count"); cCount=document.getElementById("countC"); loadAll(); }
  start();
})();
</script>
</body>
</html>
