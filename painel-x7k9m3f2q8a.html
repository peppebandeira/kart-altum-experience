<script>
(function(){

  function norm(s){ return (s||"").toString().trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,""); }

  function loadGrid(cb){ C.from("kart_grid").select("inst_id,col").then(function(r){ if(r.error){ if(cb) cb(false); return; } var g={}; (r.data||[]).forEach(function(x){ g[x.inst_id]=x.col; }); var ch=JSON.stringify(g)!==JSON.stringify(GRID); GRID=g; if(cb) cb(ch); }); }

  function setupSync(){ try{ C.channel("kgrid").on("postgres_changes",{event:"*",schema:"public",table:"kart_grid"},function(){ setTimeout(refreshGrid,400); }).subscribe(); }catch(e){} setInterval(refreshGrid,15000); }

  function verComp(rv){ if(!rv.comprovante_path){ alert("Sem comprovante."); return; } C.storage.from("comprovantes").createSignedUrl(rv.comprovante_path,3600).then(function(r){ if(r.data&&r.data.signedUrl){ window.open(r.data.signedUrl,"_blank"); } else { alert("Erro ao abrir comprovante."); } }); }
  function excluir(rv){ if(!confirm("Excluir a inscricao de "+(rv.nome||"")+"? Remove da lista e apaga a imagem enviada. Nao da pra desfazer.")) return; C.from("kart_reservas").update({status:"recusado"}).eq("id",rv.id).then(function(r){ if(r.error){ alert("Erro ao excluir: "+r.error.message); return; } if(rv.comprovante_path){ C.storage.from("comprovantes").remove([rv.comprovante_path]); } loadAll(); }); }
  function marcarConfirmado(rv){ var patch={status:"confirmado",confirmacao_enviada_em:new Date().toISOString()}; C.from("kart_reservas").update(patch).eq("id",rv.id).then(function(r){ if(r.error){ alert("Erro ao confirmar: "+r.error.message); return; } loadAll(); }); }
  function cardAg(rv){ var d=el("div","card"); var t=el("div","top"); t.appendChild(el("div","nm",rv.nome||"(sem nome)")); t.appendChild(el("div","val","R$"+(rv.valor_total||0))); d.appendChild(t); d.appendChild(el("div","meta",(isW(rv)?"Mulher":"Geral")+" - "+(rv.qtd_baterias||1)+" prova(s) - Peso: "+pesoTxt(rv)+" - WhatsApp: "+(rv.whatsapp||"-")+(rv.kit?" - KIT (luva+balaclava)":""))); var area=el("div"); d.appendChild(area); function inicio(){ area.innerHTML=""; var row=el("div","row"); var bv=el("button","bv","Ver comprovante"); bv.onclick=function(){ verComp(rv); }; var bw=el("button","bc","Abrir WhatsApp"); bw.onclick=function(){ abrir(); }; var bx=el("button",null,"Excluir"); bx.setAttribute("style","cursor:pointer;border:1px solid #7a2e2e;background:transparent;color:#e08a8a;font-weight:700;font-size:14px;padding:10px 16px;border-radius:8px"); bx.onclick=function(){ excluir(rv); }; row.appendChild(bv); row.appendChild(bw); row.appendChild(bx); area.appendChild(row); } function abrir(){ var link=waLink(rv.whatsapp,rv.nome); var w=window.open(link,"_blank"); area.innerHTML=""; if(!w){ var warn=el("div"); warn.setAttribute("style","color:#E0A800;font-size:13px;margin:2px 0 8px"); warn.textContent="Pop-up bloqueado. Abra o WhatsApp manualmente no botao abaixo:"; area.appendChild(warn); var a=el("a",null,"Abrir WhatsApp"); a.setAttribute("href",link); a.setAttribute("target","_blank"); a.setAttribute("rel","noopener"); a.setAttribute("style","display:inline-block;background:#25D366;color:#0A1628;font-weight:800;font-size:14px;padding:9px 16px;border-radius:8px;text-decoration:none;margin:0 0 10px"); area.appendChild(a); } passo2(); } function passo2(){ var q=el("div"); q.setAttribute("style","color:#C9C5BC;font-size:13px;margin:4px 0 8px"); q.textContent="Ja enviou a mensagem pra "+(rv.nome||"")+" no WhatsApp?"; area.appendChild(q); var row=el("div","row"); var yes=el("button","bc","Sim, enviei - confirmar"); yes.onclick=function(){ yes.disabled=true; marcarConfirmado(rv); }; var no=el("button","bv","Ainda nao"); no.onclick=function(){ inicio(); }; row.appendChild(yes); row.appendChild(no); area.appendChild(row); } inicio(); return d; }
  function cardColor(w,q,socio){ if(socio) return {bg:"transparent",fg:"#fff",bd:"#B8922A"}; if(w){ if(q>=3)return{bg:"#E03B3B",fg:"#fff"}; if(q===2)return{bg:"#8B5CF6",fg:"#fff"}; return{bg:"#FF4FA3",fg:"#fff"}; } if(q>=3)return{bg:"#2D7DD2",fg:"#fff"}; if(q===2)return{bg:"#2FA84F",fg:"#fff"}; return{bg:"#E8B923",fg:"#1a1a1a"}; }
  function defCols(rv){ var n=rv.qtd_baterias||1; var out=[]; if(isW(rv)){ out.push("fem"); for(var i=1;i<n&&out.length<4;i++){ out.push("g"+i); } } else { for(var j=1;j<=n&&j<=3;j++){ out.push("g"+j); } } return out; }
  function buildInstances(cf){ var ovr=getOvr(); var inst=[]; cf.forEach(function(rv){ var n=rv.qtd_baterias||1; var fem=(rv.bateria==="feminina"); for(var i=0;i<n;i++){ var id=rv.id+"@"+i; var o=ovr[id]; var pin=(o&&o!=="auto")?o:null; inst.push({id:id,rv:rv,pin:pin,kind:(fem&&i===0)?"fem":"geral",w:pesoOf(rv),q:n,woman:isW(rv)}); } }); return inst; }
  function gridCard(it){ var col=cardColor(it.woman,it.q,isSocio(it.rv)); var d=el("div"); d.setAttribute("draggable","true"); d.setAttribute("data-id",it.id); d.setAttribute("style","background:"+col.bg+";color:"+col.fg+";border:2px solid "+(col.bd||"transparent")+";border-radius:8px;padding:8px 10px;margin-bottom:8px;cursor:grab;box-shadow:0 1px 3px rgba(0,0,0,.4)"); var row=el("div"); row.setAttribute("style","display:flex;justify-content:space-between;align-items:center;gap:8px"); var nm=el("div",null,it.rv.nome||"?"); nm.setAttribute("style","font-weight:800;font-size:13px;line-height:1.15"); var wv=el("div"); wv.setAttribute("style","font-weight:900;font-size:21px;white-space:nowrap"); wv.innerHTML=(it.w!=null?it.w:"-")+"<span style=\"font-size:11px;font-weight:700\">kg</span>"; var lw=el("div"); lw.setAttribute("style","display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden"); lw.appendChild(nm); if(it.rv.kit){ var kb=el("span",null,"KIT"); kb.setAttribute("style","background:#fff;color:#111;font-size:9px;font-weight:800;border-radius:4px;padding:1px 5px;flex:none"); lw.appendChild(kb); } row.appendChild(lw); row.appendChild(wv); d.appendChild(row); d.addEventListener("dragstart",function(e){ e.dataTransfer.setData("text/plain",it.id); e.dataTransfer.effectAllowed="move"; DRAG=true; d.style.opacity=".4"; }); d.addEventListener("dragend",function(){ DRAG=false; d.style.opacity="1"; }); return d; }
  function byW(a,b){ if(a.w==null&&b.w==null)return 0; if(a.w==null)return 1; if(b.w==null)return -1; return b.w-a.w; }
  /* BATERIAS: minimo QUORUM, maximo CAP. Bateria 1 enche ate QUORUM, abre a 2 e enche ate QUORUM...; quando todas tem QUORUM, o excedente e distribuido equilibrado ate CAP.
     Quantidade = max(ceil(corridas/CAP), maior n de corridas de um piloto). Ordem por peso (mais pesado na Bateria 1). Mesmo piloto nunca repete bateria (troca com o peso mais proximo).
     Manual: arrastar fixa ("g2", "fem"); "auto" devolve ao automatico. */
  function planHeats(G){
    function pidx(it){ return (it.pin&&/^g\d+$/.test(it.pin))?(+it.pin.slice(1)):0; }
    var S=G.length, per={}, maxQ=0, pinMax=0, i, j;
    G.forEach(function(it){ per[it.rv.id]=(per[it.rv.id]||0)+1; if(per[it.rv.id]>maxQ) maxQ=per[it.rv.id]; if(pidx(it)>pinMax) pinMax=pidx(it); });
    var k=Math.max(S?1:0,Math.ceil(S/CAP),maxQ,pinMax), sizes=[], rem=S;
    for(i=0;i<k;i++){ sizes.push(Math.min(QUORUM,rem)); rem-=sizes[i]; }
    while(rem>0){ var m=-1; for(i=0;i<k;i++){ if(sizes[i]<CAP&&(m<0||sizes[i]<sizes[m])) m=i; } if(m<0){ sizes.push(0); k++; continue; } sizes[m]++; rem--; }
    var heats=[]; for(i=0;i<k;i++) heats.push([]);
    var auto=[]; G.forEach(function(it){ var p=pidx(it); if(p>0){ it._pin=true; heats[p-1].push(it); } else { it._pin=false; auto.push(it); } });
    var caps=[], sum=0; for(i=0;i<k;i++){ caps.push(Math.max(0,sizes[i]-heats[i].length)); sum+=caps[i]; }
    while(sum<auto.length){ var mm=-1; for(i=0;i<k;i++){ if(heats[i].length+caps[i]<CAP&&(mm<0||heats[i].length+caps[i]<heats[mm].length+caps[mm])) mm=i; } if(mm<0){ heats.push([]); caps.push(0); sizes.push(0); k++; continue; } caps[mm]++; sum++; }
    for(i=k-1;i>=0&&sum>auto.length;i--){ var cut=Math.min(caps[i],sum-auto.length); caps[i]-=cut; sum-=cut; }
    var srt=auto.slice().sort(byW), p=0; for(i=0;i<k;i++){ for(j=0;j<caps[i];j++){ heats[i].push(srt[p++]); } }
    function cnt(h,id){ return heats[h].filter(function(x){return x.rv.id===id;}).length; }
    for(var guard=0;guard<600;guard++){ var found=false;
      for(var h=0;h<heats.length&&!found;h++){ for(var a=0;a<heats[h].length&&!found;a++){ var s=heats[h][a]; if(s._pin||cnt(h,s.rv.id)<2) continue;
        var best=null; for(var t=0;t<heats.length;t++){ if(t===h||cnt(t,s.rv.id)>0) continue; heats[t].forEach(function(c,ci){ if(c._pin||cnt(h,c.rv.id)>0) return; var dd=Math.abs((c.w||0)-(s.w||0))+Math.abs(t-h)*0.001; if(!best||dd<best.d) best={t:t,ci:ci,d:dd}; }); }
        if(best){ var c=heats[best.t][best.ci]; heats[best.t][best.ci]=s; heats[h][a]=c; found=true; }
        else { for(var t2=0;t2<heats.length&&!found;t2++){ if(t2!==h&&cnt(t2,s.rv.id)===0&&heats[t2].length<CAP){ heats[t2].push(s); heats[h].splice(a,1); found=true; } } if(!found){ heats.push([s]); heats[h].splice(a,1); found=true; } }
      } }
      if(!found) break; }
    /* completa cada bateria ate QUORUM puxando os mais pesados das seguintes (sem repetir piloto) */
    for(var fi=0;fi<heats.length;fi++){ var g2=0; while(heats[fi].length<QUORUM&&g2++<60){ var bj=-1,bc=-1; for(var j2=fi+1;j2<heats.length;j2++){ heats[j2].forEach(function(cc,ci){ if(cc._pin) return; if(heats[fi].some(function(x){return x.rv.id===cc.rv.id;})) return; if(bj<0||byW(cc,heats[bj][bc])<0){ bj=j2; bc=ci; } }); } if(bj<0) break; heats[fi].push(heats[bj].splice(bc,1)[0]); } }
    while(heats.length>1&&heats[heats.length-1].length===0) heats.pop();
    return heats;
  }
  function renderBoard(cf){ LASTCF=cf;
    boardEl.innerHTML=""; boardEl.setAttribute("style","display:flex;gap:12px;align-items:flex-start;margin-top:8px;flex-wrap:wrap");
    var inst=buildInstances(cf), femS=[], G=[];
    inst.forEach(function(it){ if(it.pin==="fem"||(!it.pin&&it.kind==="fem")) femS.push(it); else G.push(it); });
    var heats=planHeats(G);
    if(cCount) cCount.textContent=cf.length+" confirmado(s) \u00b7 "+G.length+" corrida(s) na geral \u00b7 "+heats.length+" bateria(s) geral \u00b7 m\u00ednimo "+QUORUM+", m\u00e1ximo "+CAP;
    function drop(target,key){ target.addEventListener("dragover",function(e){ e.preventDefault(); target.style.background="#16161a"; }); target.addEventListener("dragleave",function(){ target.style.background=""; }); target.addEventListener("drop",function(e){ e.preventDefault(); target.style.background=""; var id=e.dataTransfer.getData("text/plain"); if(!id)return; saveCol(id,key); renderBoard(LASTCF); }); }
    function col(key,label,ac,list){ var cd=el("div"); cd.setAttribute("style","flex:1;min-width:190px;background:#101012;border:1px solid #26262b;border-top:3px solid "+ac+";border-radius:10px;padding:10px");
      var h=el("div",null,label); h.setAttribute("style","font-family:Georgia,serif;font-weight:700;font-size:15px;color:"+ac);
      var n=list.length, ids={}, dup=false; list.forEach(function(x){ if(ids[x.rv.id]) dup=true; ids[x.rv.id]=1; });
      var ok=n>=QUORUM&&n<=CAP&&!dup; var st=el("div"); st.textContent=n+" / "+CAP+(n===0?"":(n<QUORUM?" \u00b7 faltam "+(QUORUM-n)+" p/ fechar":(n>CAP?" \u00b7 acima de "+CAP:" \u00b7 fechada")))+(dup?" \u00b7 \u26a0 piloto repetido":"");
      st.setAttribute("style","font-size:12px;margin:2px 0 10px;color:"+(n===0?"#8a867d":(ok?"#7fd99a":"#E0533B")));
      var bd=el("div"); bd.setAttribute("style","min-height:120px"); drop(cd,key);
      cd.appendChild(h); cd.appendChild(st); cd.appendChild(bd); list.slice().sort(byW).forEach(function(it){ bd.appendChild(gridCard(it)); }); boardEl.appendChild(cd); }
    heats.forEach(function(hs,i){ col("g"+(i+1),"Bateria "+(i+1),"#E8B923",hs); });
    col("fem","Feminina","#FF4FA3",femS);
    var aux=el("div"); aux.setAttribute("style","flex:0 0 150px;display:flex;flex-direction:column;gap:10px");
    function mini(label,key,color){ var z=el("div",null,label); z.setAttribute("style","border:1px dashed "+color+";color:"+color+";border-radius:10px;padding:16px 10px;font-size:12px;text-align:center;min-height:60px"); drop(z,key); aux.appendChild(z); }
    mini("+ Abrir nova bateria","g"+(heats.length+1),"#E8B923"); mini("\u21ba Voltar ao autom\u00e1tico","auto","#8a867d");
    boardEl.appendChild(aux);
  }

  function loadAll2(){ C.from("kart_pilotos_pub").select("full_name,weight_kg,sexo").then(function(pr){ pmap={}; (pr.data||[]).forEach(function(p){ pmap[(p.full_name||"").trim()]={w:p.weight_kg,sexo:p.sexo}; }); C.from("kart_reservas").select("*").eq("edicao",EDICAO).order("created_at",{ascending:true}).then(function(r){ if(r.error){ aBox.textContent="Erro: "+r.error.message; return; } var all=r.data||[]; var ag=all.filter(function(x){return x.status==="aguardando";}); var cf=all.filter(function(x){return x.status==="confirmado";}); aBox.innerHTML=""; aCount.textContent=ag.length+" aguardando"; if(!ag.length){ aBox.innerHTML="<p class=\"empty\">Nenhuma aguardando confirmacao.</p>"; } else { ag.forEach(function(rv){ aBox.appendChild(cardAg(rv)); }); } renderBoard(cf); }); }); }
  function start(){ if(!window.supabase||!window.supabase.createClient){ setTimeout(start,100); return; } C=window.supabase.createClient(window.__CFG.url,window.__CFG.key); setupSync(); aBox=document.getElementById("list"); aCount=document.getElementById("count"); cCount=document.getElementById("countC"); boardEl=document.getElementById("board"); loadAll(); }
  start();
})();
