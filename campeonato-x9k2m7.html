<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campeonato — Kart Altum Experience</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
<style>
/* ================================================================
   KART ALTUM EXPERIENCE — tema do sub-brand (racing / dark)
   Preto + ouro metálico + branco. Ver marca-kartos.md
   ================================================================ */
:root{
  --black:#0B0B0C;
  --surface:#1A1A1C;
  --surface-2:#232326;
  --gold:#C9A227;
  --gold-hi:#E8C558;
  --gold-lo:#8A6E1E;
  --white:#FFFFFF;
  --muted:#9A968C;
  --line:#2E2E31;
  --navy:#0A1628;
  /* semáforo */
  --sem-good:#2E7D32;
  --sem-mid:#E0A800;
  --sem-bad:#C0392B;
  --font-display:"Saira Condensed","Oswald","Arial Narrow",sans-serif;
  --font-sans:Arial,Helvetica,sans-serif;
  --font-serif:Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--black);
  color:var(--white);
  font-family:var(--font-sans);
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
a{color:inherit;text-decoration:none}

/* ---- barra de topo com bandeira quadriculada ---- */
.checker{
  height:10px;
  background:
    repeating-conic-gradient(var(--white) 0% 25%, transparent 0% 50%) 0/20px 20px,
    var(--gold);
  opacity:.9;
}
header.top{
  background:linear-gradient(180deg,#111 0%,var(--black) 100%);
  border-bottom:1px solid var(--line);
  padding:18px 20px 14px;
}
.brand-row{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;max-width:1200px;margin:0 auto}
.brand h1{
  font-family:var(--font-display);
  font-style:italic;
  font-weight:700;
  letter-spacing:.5px;
  font-size:30px;
  line-height:1;
  text-transform:uppercase;
}
.brand h1 .k{color:var(--gold)}
.brand .edition{
  font-family:var(--font-sans);font-weight:700;font-size:11px;letter-spacing:3px;
  color:var(--gold);text-transform:uppercase;
}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap}
nav.tabs a{
  font-weight:700;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;
  padding:9px 14px;border:1px solid var(--line);border-radius:6px;color:var(--muted);
  transition:.15s;
}
nav.tabs a:hover{color:var(--white);border-color:var(--gold-lo)}
nav.tabs a.active{color:var(--black);background:var(--gold);border-color:var(--gold)}

main{max-width:1200px;margin:0 auto;padding:26px 20px 60px}

/* ---- títulos de seção ---- */
.section-title{
  font-family:var(--font-display);font-style:italic;font-weight:700;text-transform:uppercase;
  font-size:22px;letter-spacing:.5px;margin:6px 0 14px;display:flex;align-items:center;gap:10px;
}
.section-title::before{content:"";width:26px;height:12px;
  background:repeating-conic-gradient(var(--white) 0% 25%, transparent 0% 50%) 0/6px 6px;}
.sub{color:var(--muted);font-size:13px;margin-bottom:18px}

/* ---- cartões / grids ---- */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.card .label{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
.card .value{font-family:var(--font-display);font-weight:700;font-size:30px;color:var(--gold);margin-top:4px;line-height:1}
.card .value.white{color:var(--white)}
.card .value small{font-size:14px;color:var(--muted);font-family:var(--font-sans);font-weight:400}

/* ---- tabela ---- */
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
thead th{
  background:var(--surface-2);color:var(--muted);text-transform:uppercase;letter-spacing:1px;
  font-size:11px;text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap;
}
tbody td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:#141416}
td.num,th.num{text-align:center;font-variant-numeric:tabular-nums}
.pos{font-family:var(--font-display);font-weight:700;font-size:17px}
.pilot-name{font-weight:700}
.pilot-name small{display:block;color:var(--muted);font-weight:400;font-size:11px}
.pts{font-family:var(--font-display);font-weight:700;font-size:18px;color:var(--gold)}

/* pódio */
tr.podium-1 td:first-child{box-shadow:inset 3px 0 0 var(--gold)}
tr.podium-2 td:first-child{box-shadow:inset 3px 0 0 #C0C0C0}
tr.podium-3 td:first-child{box-shadow:inset 3px 0 0 #CD7F32}

/* ---- badges ---- */
.badge{display:inline-block;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;
  padding:3px 7px;border-radius:4px;margin-left:5px;vertical-align:middle}
.badge.pole{background:var(--gold);color:var(--black)}
.badge.fl{background:transparent;color:var(--gold-hi);border:1px solid var(--gold-lo)}
.badge.dnf{background:#3a1e1e;color:#e88}
.badge.bond{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}

/* ---- semáforo ---- */
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:middle}
.sem-good{color:var(--sem-good)} .sem-good .dot,.dot.sem-good{background:var(--sem-good)}
.sem-mid{color:var(--sem-mid)} .sem-mid .dot,.dot.sem-mid{background:var(--sem-mid)}
.sem-bad{color:var(--sem-bad)} .sem-bad .dot,.dot.sem-bad{background:var(--sem-bad)}
td.sem-cell{font-weight:700;font-variant-numeric:tabular-nums}

/* ---- controles / dropdowns ---- */
.controls{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
select,input,textarea{
  background:var(--surface);color:var(--white);border:1px solid var(--line);border-radius:8px;
  padding:11px 12px;font-family:var(--font-sans);font-size:14px;min-width:220px;
}
select:focus,input:focus,textarea:focus{outline:none;border-color:var(--gold)}

/* ---- formulário de cadastro ---- */
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.form-grid .full{grid-column:1/-1}
.form-grid .field{gap:7px}
.hint{font-size:12px;color:var(--muted)}
.btn{
  display:inline-flex;align-items:center;gap:10px;cursor:pointer;
  background:linear-gradient(180deg,var(--gold-hi),var(--gold) 55%,var(--gold-lo));
  color:var(--black);font-weight:700;letter-spacing:2px;text-transform:uppercase;font-size:14px;
  border:none;border-radius:8px;padding:14px 26px;
}
.btn::before{content:"»»";font-weight:700}
.notice{background:#141416;border:1px solid var(--line);border-left:3px solid var(--gold);
  border-radius:8px;padding:12px 14px;color:var(--muted);font-size:13px;margin:14px 0}

/* ---- rodapé com assinatura ALTUM ---- */
footer{border-top:1px solid var(--line);margin-top:40px;padding:26px 20px;text-align:center}
footer .altum{font-family:var(--font-serif);font-size:26px;letter-spacing:6px;color:var(--white)}
footer .tagline{font-family:var(--font-serif);font-style:italic;color:var(--gold);font-size:14px;margin-top:2px}
footer .meta{color:var(--muted);font-size:11px;margin-top:10px;letter-spacing:1px}

.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--muted)}
.legend span{display:flex;align-items:center}
.empty{color:var(--muted);padding:20px;text-align:center}

@media (max-width:560px){
  .brand h1{font-size:24px}
  main{padding:20px 14px 50px}
}

/* ==== pódio de 5 lugares (kart) ==== */
tr.podium-4 td:first-child{box-shadow:inset 3px 0 0 #8A6E1E}
tr.podium-5 td:first-child{box-shadow:inset 3px 0 0 #6B6359}
.podium5{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:4px 0 22px}
.pcard{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;padding:13px 15px}
.pcard.p1{border-left-color:#C9A227}
.pcard.p2{border-left-color:#C0C0C0}
.pcard.p3{border-left-color:#CD7F32}
.pcard.p4{border-left-color:#8A6E1E}
.pcard.p5{border-left-color:#6B6359}
.pcard .prank{font-family:var(--font-display);font-style:italic;font-weight:700;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.pcard .pname{font-weight:700;font-size:15px;margin-top:2px;line-height:1.2}
.pcard .ppts{font-family:var(--font-display);font-weight:700;font-size:22px;color:var(--gold);margin-top:4px}
.pcard .ppts small{font-size:12px;color:var(--muted);font-family:var(--font-sans);font-weight:400}
.mini-stats{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:16px;color:var(--muted);font-size:13px}
.mini-stats b{color:var(--white);font-weight:700}
.mini-stats .g{color:var(--gold);font-weight:700}
/* ==== gráfico ==== */
.chart-box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;margin:6px 0 24px}
.chart-box .chart-title{font-family:var(--font-display);font-style:italic;font-weight:700;text-transform:uppercase;font-size:15px;letter-spacing:.5px;margin-bottom:12px}
.chart-wrap{position:relative;width:100%;height:280px}
.back-link{display:inline-block;color:var(--muted);font-size:12px;letter-spacing:1.5px;text-transform:uppercase;font-weight:700;margin-top:10px}
.back-link:hover{color:var(--gold)}
.badge.reg{background:#12331e;color:#7fd99a;border:1px solid #2E7D32}
.badge.pend{background:#2a2410;color:#E0A800;border:1px solid #8A6E1E}
/* ---- botão WhatsApp ---- */
.wa{display:inline-flex;align-items:center;justify-content:center;gap:4px;width:24px;height:24px;
  margin-left:8px;border-radius:6px;background:#1e3a2a;border:1px solid #2E7D32;vertical-align:middle;
  transition:.15s}
.wa:hover{background:#25543b;border-color:#3fae63}
.wa svg{width:14px;height:14px;fill:#7fd99a}
</style></head><body><main><div id="app"></div></main>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="data.js"></script><script src="scoring.js"></script><script>
/* ============ CAMPEONATO (restrito) — ranking completo + gráficos ============ */
(async function () {
  const db = window.__DB__;
  const cfg = db.config;
  const PALETTE = ["#C9A227","#C0C0C0","#CD7F32","#8A6E1E","#6B6359"];
  function add(root,html){const t=document.createElement("template");t.innerHTML=html.trim();root.appendChild(t.content);}
  function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
  function two(p){const t=(p.name||"").trim().split(/\s+/);return t.length>1?t[0]+" "+t[t.length-1]:t[0];}
  function bondBadge(p){const l=cfg.bond_labels[p.bond_type]||p.bond_type;return `<span class="badge bond">${esc(l)}</span>`;}
  function waBtn(p){if(!p.whatsapp)return"";let num=String(p.whatsapp).replace(/\D/g,"");if(!num)return"";if(num.length<=11)num="55"+num;
    return `<a class="wa" href="https://wa.me/${num}" target="_blank" rel="noopener" title="Falar no WhatsApp" aria-label="WhatsApp de ${esc(p.name)}"><svg viewBox="0 0 24 24"><path d="M17.5 14.4c-.3-.15-1.7-.85-2-.95-.26-.1-.45-.15-.65.15-.2.3-.75.94-.92 1.14-.17.2-.34.22-.63.07-.3-.15-1.25-.46-2.38-1.47-.88-.78-1.47-1.75-1.65-2.05-.17-.3-.02-.46.13-.6.13-.13.3-.34.44-.5.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.08-.15-.65-1.57-.9-2.15-.24-.56-.48-.48-.65-.49l-.56-.01c-.2 0-.5.07-.77.37-.26.3-1 .98-1 2.4 0 1.4 1.02 2.76 1.17 2.95.15.2 2.02 3.08 4.9 4.32.68.3 1.22.47 1.63.6.69.22 1.31.19 1.8.11.55-.08 1.7-.7 1.94-1.36.24-.67.24-1.24.17-1.36-.07-.12-.26-.2-.56-.34zM12 2C6.48 2 2 6.48 2 12c0 1.77.46 3.43 1.27 4.87L2 22l5.25-1.38A9.94 9.94 0 0 0 12 22c5.52 0 10-4.48 10-10S17.52 2 12 2z"/></svg></a>`;}

  const _t=document.createElement("template");
  _t.innerHTML=`<div class="kae-chrome"><div class="checker"></div>
    <header class="top"><div class="brand-row">
      <div class="brand"><h1><span class="k">KART</span> ALTUM EXPERIENCE</h1></div>
      <span class="badge" style="background:#3a1e1e;color:#e88;font-size:11px">🔒 Campeonato · restrito</span>
    </div></header></div>`.trim();
  document.body.prepend(_t.content.firstChild);
  add(document.body,`<footer class="kae-foot"><div class="altum">ALTUM</div><div class="tagline">${esc(cfg.tagline)}</div><div class="meta">${esc(cfg.championship)} · Temporada ${cfg.season} · Área restrita aos sócios</div></footer>`);

  const root=document.getElementById("app");
  /* ---- cadastro ao vivo: marca "cadastrado" lendo o Supabase a cada refresh (só nomes, sem PII) ---- */
  const SB_URL="https://uzghezeaxysdsgzpmejp.supabase.co";
  const SB_KEY="sb_publishable_SLv9hMsbMxAs7643nF6NJA_d8PNBBlV";
  function _norm(s){return (s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();}
  function _tok(s){return _norm(s).split(/\s+/).filter(t=>t.length>2);}
  async function markCadastrados(){try{if(!window.supabase||!window.supabase.createClient)return;const sb=window.supabase.createClient(SB_URL,SB_KEY);const {data,error}=await sb.rpc("kart_cadastrados");if(error||!data)return;db.pilots.forEach(p=>{const t=_tok(p.name);if(!t.length)return;const f=t[0],l=t[t.length-1];const hit=data.find(r=>{const s=new Set(_tok(r.nome));return s.has(f)&&s.has(l);});if(hit){p.registered=true;if(hit.vinculo)p.bond_type=hit.vinculo;if(hit.telefone)p.whatsapp=hit.telefone;if(hit.padrinho)p.sponsor=hit.padrinho;}});}catch(e){}}
  await markCadastrados();
  const st=KartGP.championship(db);
  const fk=[...st].sort((a,b)=>b.fastest_laps-a.fastest_laps)[0];
  const pk=[...st].sort((a,b)=>b.poles-a.poles)[0];

  add(root,`<div class="notice">Página restrita — visão de campeonato para você e os sócios. Liberada a todos os pilotos ao fim da temporada.</div>`);
  add(root,`<div class="mini-stats"><span>Etapas oficiais <b>${db.races.filter(r=>r.official!==false).length}</b></span>
    <span>Pilotos <b>${db.pilots.length}</b></span>
    <span>Rei das poles <span class="g">${pk&&pk.poles?esc(pk.pilot.name):"—"}</span></span>
    <span>Rei da volta rápida <span class="g">${fk&&fk.fastest_laps?esc(fk.pilot.name):"—"}</span></span></div>`);
  add(root,`<h2 class="section-title">Pódio do campeonato</h2>`);
  add(root,`<div class="podium5">${st.slice(0,5).map((s,i)=>`<div class="pcard p${i+1}"><div class="prank">${i+1}º lugar</div><div class="pname">${esc(s.pilot.name)}</div><div class="ppts">${s.total}<small> pts</small></div></div>`).join("")}</div>`);
  if(window.Chart){add(root,`<div class="chart-box"><div class="chart-title">Evolução do campeonato — top 5</div><div class="chart-wrap"><canvas id="champChart" role="img" aria-label="Evolução de pontos do campeonato"></canvas></div></div>`);}
  add(root,`<h2 class="section-title">Classificação geral</h2>`);
  add(root,`<div class="sub">Descartamos as <strong>2 piores etapas</strong> dos pilotos que correrem todas as etapas, para equilibrar a competição. Semáforo pela posição no pelotão ou campeonato.</div>`);
  const rows=st.map(s=>{const sem=KartGP.semaphoreRank(s.rank,st.length);const pod=s.rank<=5?`podium-${s.rank}`:"";
    return `<tr class="${pod}"><td class="num"><span class="pos">${s.rank}</span></td>
      <td class="pilot-name">${esc(s.pilot.name)}${waBtn(s.pilot)} ${s.pilot.nickname?`<small>“${esc(s.pilot.nickname)}”</small>`:""}</td>
      <td>${bondBadge(s.pilot)} ${s.pilot.registered?'<span class="badge reg">✓ cadastrado</span>':'<span class="badge pend">pendente</span>'}</td><td class="num pts">${s.total}</td><td class="num">${s.played}</td>
      <td class="num">${s.wins||"—"}</td><td class="num">${s.poles||"—"}</td><td class="num">${s.fastest_laps||"—"}</td>
      <td class="num sem-cell ${sem}"><span class="dot ${sem}"></span></td></tr>`;}).join("");
  add(root,`<div class="table-wrap"><table><thead><tr><th class="num">#</th><th>Piloto</th><th>Vínculo</th>
    <th class="num">Pontos</th><th class="num">Provas</th><th class="num">Vit.</th><th class="num">Poles</th><th class="num">V.Rápida</th><th class="num">Nível</th></tr></thead>
    <tbody>${rows}</tbody></table></div>`);
  add(root,`<div class="legend"><span><span class="dot sem-good"></span>Topo do pelotão</span><span><span class="dot sem-mid"></span>Meio</span><span><span class="dot sem-bad"></span>Fundo</span></div>`);

  if(window.Chart){
    const CHART_COMMON={responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:"#9A968C",boxWidth:12,font:{size:11}}}},scales:{x:{ticks:{color:"#9A968C"},grid:{color:"#2E2E31"}},y:{ticks:{color:"#9A968C"},grid:{color:"#2E2E31"},beginAtZero:true}}};
    const rounds=db.races.filter(r=>r.official!==false).slice().sort((a,b)=>a.round-b.round);
    const labels=["Início",...rounds.map(r=>"Et. "+r.round)];
    function cum(pid){let c=0;return [0,...rounds.map(r=>{const res=db.results.find(x=>x.race_id===r.race_id&&x.pilot_id===pid);c+=res?KartGP.pointsForResult(db,res).total:0;return c;})];}
    const ds=st.slice(0,5).map((s,i)=>({label:two(s.pilot),data:cum(s.pilot_id),borderColor:PALETTE[i],backgroundColor:PALETTE[i],tension:.45,cubicInterpolationMode:"monotone",borderWidth:2,pointRadius:3,pointHoverRadius:5}));
    new Chart(document.getElementById("champChart"),{type:"line",data:{labels,datasets:ds},options:CHART_COMMON});
  }
})();
</script><script>
(function(){
  function extractClient(){
    if(!window.supabase||!window.supabase.createClient) return null;
    var src=Array.from(document.scripts).filter(function(s){return !s.src}).map(function(s){return s.textContent||""}).join("\n");
    var lits=src.match(/["\x27`]([^"\x27`\n]{8,})["\x27`]/g)||[];
    var url=null,key=null;
    lits.forEach(function(s){ var v=s.slice(1,-1);
      if(!url && /\.supabase\.co/.test(v)) url=v;
      if(!key && (/^eyJ/.test(v)||/^sb_/.test(v)||(v.length>60 && /^[A-Za-z0-9_\-\.]+$/.test(v)))) key=v;
    });
    if(!url||!key) return null;
    return window.supabase.createClient(url,key);
  }
  function el(tag,css,txt){ var e=document.createElement(tag); if(css) e.setAttribute("style",css); if(txt!=null) e.textContent=txt; return e; }

    return "https://wa.me/"+d+"?text="+encodeURIComponent(msg);
  }
  var C=null;
  function verComp(rv){
    if(!rv.comprovante_path){ alert("Sem comprovante anexado."); return; }
    C.storage.from("comprovantes").createSignedUrl(rv.comprovante_path,3600).then(function(r){
      if(r.data && r.data.signedUrl){ window.open(r.data.signedUrl,"_blank"); } else { alert("Erro ao abrir comprovante."); }
    });
  }
  function confirmar(rv,cardEl){
    window.open(waLink(rv.whatsapp,rv.nome),"_blank");
    C.from("kart_reservas").update({status:"confirmado"}).eq("id",rv.id).then(function(r){
      if(r.error){ alert("Erro ao confirmar: "+r.error.message); return; }
      if(rv.comprovante_path){ C.storage.from("comprovantes").remove([rv.comprovante_path]); }
      cardEl.remove(); tick();
    });
  }
  var listBox,countEl;
  function tick(){ var n=listBox.querySelectorAll("[data-rv]").length; countEl.textContent=n+(n===1?" aguardando":" aguardando"); if(n===0){ listBox.innerHTML="<p style=\"color:#9A968C;font-size:15px\">Nenhuma inscricao aguardando confirmacao.</p>"; } }
  function card(rv){
    var d=el("div","background:#141416;border:1px solid #2C2C30;border-radius:12px;padding:16px 18px;margin-bottom:12px"); d.setAttribute("data-rv","1");
    var top=el("div","display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;align-items:baseline;margin-bottom:12px");
    var nm=el("div","font-family:var(--f-disp,sans-serif);font-style:italic;font-weight:800;text-transform:uppercase;font-size:19px;color:#fff", rv.nome||"(sem nome)");
    var val=el("div","font-family:var(--f-disp,sans-serif);font-weight:800;font-size:19px;color:#C9A227", "R$"+(rv.valor_total||0));
    top.appendChild(nm); top.appendChild(val); d.appendChild(top);
    var meta=el("div","color:#C9C5BC;font-size:14px;margin-bottom:14px", (rv.bateria==="feminina"?"Feminina":"Geral")+" - "+(rv.qtd_baterias||1)+" bateria(s) - WhatsApp: "+(rv.whatsapp||"-"));
    d.appendChild(meta);
    var row=el("div","display:flex;gap:10px;flex-wrap:wrap");
    var vc=el("button","cursor:pointer;border:1px solid #8A6E1E;background:transparent;color:#E8C558;font-weight:700;font-size:14px;padding:10px 16px;border-radius:8px","Ver comprovante");
    vc.onclick=function(){ verComp(rv); };
    var cf=el("button","cursor:pointer;border:none;background:#25D366;color:#0A1628;font-weight:800;font-size:14px;padding:10px 16px;border-radius:8px","Confirmar no WhatsApp");
    cf.onclick=function(){ if(confirm("Confirmar a vaga de "+(rv.nome||"")+"? Isso avisa no WhatsApp e apaga o comprovante.")){ confirmar(rv,d); } };
    row.appendChild(vc); row.appendChild(cf); d.appendChild(row);
    return d;
  }
  function render(data){
    listBox.innerHTML="";
    if(!data.length){ tick(); return; }
    data.forEach(function(rv){ listBox.appendChild(card(rv)); });
    tick();
  }
  function load(){
    C=extractClient(); if(!C){ setTimeout(load,150); return; }
    var sec=el("section","max-width:1000px;margin:0 auto;padding:26px 20px 22px");
    var h=el("div","font-family:var(--f-disp,sans-serif);font-style:italic;font-weight:800;text-transform:uppercase;font-size:clamp(22px,5vw,32px);color:#fff", "Inscricoes - confirmacao");
    countEl=el("div","color:#E8C558;font-size:14px;margin:4px 0 18px","carregando...");
    listBox=el("div",""); listBox.textContent="Carregando...";
    sec.appendChild(h); sec.appendChild(countEl); sec.appendChild(listBox);
    document.body.insertBefore(sec, document.body.firstChild);
    C.from("kart_reservas").select("*").eq("status","aguardando").order("created_at",{ascending:true}).then(function(r){
      if(r.error){ listBox.textContent="Erro: "+r.error.message; countEl.textContent=""; return; }
      render(r.data||[]);
    });
  }
  if(document.readyState==="loading"){ document.addEventListener("DOMContentLoaded",load); } else { load(); }
})();
</script>
</body></html>
