<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kart Altum Experience</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
<style>
/* ================================================================
   KART ALTUM EXPERIENCE — tema do sub-brand (racing / dark)
   Preto + ouro metálico + branco. Ver marca-kartos.md
   ================================================================ */
:root{
  --black:#0B0B0C;
  --surface:#1A1A1C;
  --surface-2:#232326;
  --gold:#C9A227;
  --gold-hi:#E8C558;
  --gold-lo:#8A6E1E;
  --white:#FFFFFF;
  --muted:#9A968C;
  --line:#2E2E31;
  --navy:#0A1628;
  /* semáforo */
  --sem-good:#2E7D32;
  --sem-mid:#E0A800;
  --sem-bad:#C0392B;
  --font-display:"Saira Condensed","Oswald","Arial Narrow",sans-serif;
  --font-sans:Arial,Helvetica,sans-serif;
  --font-serif:Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--black);
  color:var(--white);
  font-family:var(--font-sans);
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
a{color:inherit;text-decoration:none}

/* ---- barra de topo com bandeira quadriculada ---- */
.checker{
  height:10px;
  background:
    repeating-conic-gradient(var(--white) 0% 25%, transparent 0% 50%) 0/20px 20px,
    var(--gold);
  opacity:.9;
}
header.top{
  background:linear-gradient(180deg,#111 0%,var(--black) 100%);
  border-bottom:1px solid var(--line);
  padding:18px 20px 14px;
}
.brand-row{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;max-width:1200px;margin:0 auto}
.brand h1{
  font-family:var(--font-display);
  font-style:italic;
  font-weight:700;
  letter-spacing:.5px;
  font-size:30px;
  line-height:1;
  text-transform:uppercase;
}
.brand h1 .k{color:var(--gold)}
.brand .edition{
  font-family:var(--font-sans);font-weight:700;font-size:11px;letter-spacing:3px;
  color:var(--gold);text-transform:uppercase;
}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap}
nav.tabs a{
  font-weight:700;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;
  padding:9px 14px;border:1px solid var(--line);border-radius:6px;color:var(--muted);
  transition:.15s;
}
nav.tabs a:hover{color:var(--white);border-color:var(--gold-lo)}
nav.tabs a.active{color:var(--black);background:var(--gold);border-color:var(--gold)}

main{max-width:1200px;margin:0 auto;padding:26px 20px 60px}

/* ---- títulos de seção ---- */
.section-title{
  font-family:var(--font-display);font-style:italic;font-weight:700;text-transform:uppercase;
  font-size:22px;letter-spacing:.5px;margin:6px 0 14px;display:flex;align-items:center;gap:10px;
}
.section-title::before{content:"";width:26px;height:12px;
  background:repeating-conic-gradient(var(--white) 0% 25%, transparent 0% 50%) 0/6px 6px;}
.sub{color:var(--muted);font-size:13px;margin-bottom:18px}

/* ---- cartões / grids ---- */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.card .label{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
.card .value{font-family:var(--font-display);font-weight:700;font-size:30px;color:var(--gold);margin-top:4px;line-height:1}
.card .value.white{color:var(--white)}
.card .value small{font-size:14px;color:var(--muted);font-family:var(--font-sans);font-weight:400}

/* ---- tabela ---- */
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
thead th{
  background:var(--surface-2);color:var(--muted);text-transform:uppercase;letter-spacing:1px;
  font-size:11px;text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap;
}
tbody td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:#141416}
td.num,th.num{text-align:center;font-variant-numeric:tabular-nums}
.pos{font-family:var(--font-display);font-weight:700;font-size:17px}
.pilot-name{font-weight:700}
.pilot-name small{display:block;color:var(--muted);font-weight:400;font-size:11px}
.pts{font-family:var(--font-display);font-weight:700;font-size:18px;color:var(--gold)}

/* pódio */
tr.podium-1 td:first-child{box-shadow:inset 3px 0 0 var(--gold)}
tr.podium-2 td:first-child{box-shadow:inset 3px 0 0 #C0C0C0}
tr.podium-3 td:first-child{box-shadow:inset 3px 0 0 #CD7F32}

/* ---- badges ---- */
.badge{display:inline-block;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;
  padding:3px 7px;border-radius:4px;margin-left:5px;vertical-align:middle}
.badge.pole{background:var(--gold);color:var(--black)}
.badge.fl{background:transparent;color:var(--gold-hi);border:1px solid var(--gold-lo)}
.badge.dnf{background:#3a1e1e;color:#e88}
.badge.bond{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}

/* ---- semáforo ---- */
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:middle}
.sem-good{color:var(--sem-good)} .sem-good .dot,.dot.sem-good{background:var(--sem-good)}
.sem-mid{color:var(--sem-mid)} .sem-mid .dot,.dot.sem-mid{background:var(--sem-mid)}
.sem-bad{color:var(--sem-bad)} .sem-bad .dot,.dot.sem-bad{background:var(--sem-bad)}
td.sem-cell{font-weight:700;font-variant-numeric:tabular-nums}

/* ---- controles / dropdowns ---- */
.controls{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
select,input,textarea{
  background:var(--surface);color:var(--white);border:1px solid var(--line);border-radius:8px;
  padding:11px 12px;font-family:var(--font-sans);font-size:14px;min-width:220px;
}
select:focus,input:focus,textarea:focus{outline:none;border-color:var(--gold)}

/* ---- formulário de cadastro ---- */
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.form-grid .full{grid-column:1/-1}
.form-grid .field{gap:7px}
.hint{font-size:12px;color:var(--muted)}
.btn{
  display:inline-flex;align-items:center;gap:10px;cursor:pointer;
  background:linear-gradient(180deg,var(--gold-hi),var(--gold) 55%,var(--gold-lo));
  color:var(--black);font-weight:700;letter-spacing:2px;text-transform:uppercase;font-size:14px;
  border:none;border-radius:8px;padding:14px 26px;
}
.btn::before{content:"»»";font-weight:700}
.notice{background:#141416;border:1px solid var(--line);border-left:3px solid var(--gold);
  border-radius:8px;padding:12px 14px;color:var(--muted);font-size:13px;margin:14px 0}

/* ---- rodapé com assinatura ALTUM ---- */
footer{border-top:1px solid var(--line);margin-top:40px;padding:26px 20px;text-align:center}
footer .altum{font-family:var(--font-serif);font-size:26px;letter-spacing:6px;color:var(--white)}
footer .tagline{font-family:var(--font-serif);font-style:italic;color:var(--gold);font-size:14px;margin-top:2px}
footer .meta{color:var(--muted);font-size:11px;margin-top:10px;letter-spacing:1px}

.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--muted)}
.legend span{display:flex;align-items:center}
.empty{color:var(--muted);padding:20px;text-align:center}

@media (max-width:560px){
  .brand h1{font-size:24px}
  main{padding:20px 14px 50px}
}

/* ==== pódio de 5 lugares (kart) ==== */
tr.podium-4 td:first-child{box-shadow:inset 3px 0 0 #8A6E1E}
tr.podium-5 td:first-child{box-shadow:inset 3px 0 0 #6B6359}
.podium5{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:4px 0 22px}
.pcard{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;padding:13px 15px}
.pcard.p1{border-left-color:#C9A227}
.pcard.p2{border-left-color:#C0C0C0}
.pcard.p3{border-left-color:#CD7F32}
.pcard.p4{border-left-color:#8A6E1E}
.pcard.p5{border-left-color:#6B6359}
.pcard .prank{font-family:var(--font-display);font-style:italic;font-weight:700;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.pcard .pname{font-weight:700;font-size:15px;margin-top:2px;line-height:1.2}
.pcard .ppts{font-family:var(--font-display);font-weight:700;font-size:22px;color:var(--gold);margin-top:4px}
.pcard .ppts small{font-size:12px;color:var(--muted);font-family:var(--font-sans);font-weight:400}
.mini-stats{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:16px;color:var(--muted);font-size:13px}
.mini-stats b{color:var(--white);font-weight:700}
.mini-stats .g{color:var(--gold);font-weight:700}
/* ==== gráfico ==== */
.chart-box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;margin:6px 0 24px}
.chart-box .chart-title{font-family:var(--font-display);font-style:italic;font-weight:700;text-transform:uppercase;font-size:15px;letter-spacing:.5px;margin-bottom:12px}
.chart-wrap{position:relative;width:100%;height:280px}
.back-link{display:inline-block;color:var(--muted);font-size:12px;letter-spacing:1.5px;text-transform:uppercase;font-weight:700;margin-top:10px}
.back-link:hover{color:var(--gold)}
.badge.reg{background:#12331e;color:#7fd99a;border:1px solid #2E7D32}
.badge.pend{background:#2a2410;color:#E0A800;border:1px solid #8A6E1E}
</style></head><body><main><div id="app"></div></main>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script><script src="data.js"></script><script src="scoring.js"></script><script>
/* ============ DASHBOARD PÚBLICO — Corridas + Pilotos (sem ranking) ============ */
(function () {
  const db = window.__DB__;
  const cfg = db.config;
  const VIEWS = [
    { key: "corrida", label: "Corridas" },
    { key: "piloto", label: "Pilotos" }
  ];
  function add(root,html){const t=document.createElement("template");t.innerHTML=html.trim();root.appendChild(t.content);}
  function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
  function surname(p){return (p.name||"").trim();}
  function hpLabel(h){return h?h+" HP":"HP a confirmar";}
  function bondBadge(p){const l=cfg.bond_labels[p.bond_type]||p.bond_type;return `<span class="badge bond">${esc(l)}</span>`;}

  function buildChrome(active){
    document.querySelectorAll(".kae-chrome").forEach(n=>n.remove());
    const _t=document.createElement("template");
    _t.innerHTML=`<div class="kae-chrome"><div class="checker"></div>
      <header class="top"><div class="brand-row">
        <div class="brand"><h1><span class="k">KART</span> ALTUM EXPERIENCE</h1></div>
        <nav class="tabs">${VIEWS.map(v=>`<a href="#" data-view="${v.key}" class="${v.key===active?"active":""}">${v.label}</a>`).join("")}</nav>
      </div></header></div>`.trim();
    document.body.prepend(_t.content.firstChild);
    document.querySelector(".kae-chrome").querySelectorAll("a[data-view]").forEach(a=>a.addEventListener("click",e=>{e.preventDefault();setView(a.getAttribute("data-view"));}));
    if(!document.querySelector(".kae-foot"))
      add(document.body,`<footer class="kae-foot"><div class="altum">ALTUM</div><div class="tagline">${esc(cfg.tagline)}</div>
        <div class="meta">${esc(cfg.championship)} · Temporada ${cfg.season}</div></footer>`);
  }
  function setView(view){
    buildChrome(view);const root=document.getElementById("app");root.innerHTML="";
    if(view==="corrida")renderRace(root);
    else if(view==="piloto")renderPilot(root);
    window.scrollTo(0,0);
  }

  function podium5(list,getName,getPts){
    return `<div class="podium5">${list.slice(0,5).map((x,i)=>`<div class="pcard p${i+1}">
      <div class="prank">${i+1}º lugar</div><div class="pname">${esc(getName(x))}</div>
      <div class="ppts">${getPts(x)}<small> pts</small></div></div>`).join("")}</div>`;
  }

  /* -------- CORRIDA -------- */
  function renderRace(root){
    add(root,`<h2 class="section-title">Resultado por etapa</h2>`);
    add(root,`<div class="sub">Escolha a corrida. Semáforo pela posição no grid do dia.</div>`);
    add(root,`<div class="controls"><div class="field"><label>Corrida</label>
      <select id="raceSelect">${db.races.slice().sort((a,b)=>b.round-a.round).map(r=>`<option value="${r.race_id}">${r.official===false?"Especial":"Etapa "+r.round} · ${r.date.split("-").reverse().join("/")} · ${esc(r.venue)}</option>`).join("")}</select></div></div>`);
    add(root,`<div id="raceBody"></div>`);
    const body=root.querySelector("#raceBody");
    function draw(raceId){
      body.innerHTML="";const race=db.races.find(r=>r.race_id===raceId);const table=KartGP.raceTable(db,raceId);
      const fs=table.length;const flP=KartGP.fastestLapPilot(db,raceId);const flRow=table.find(r=>r.pilot_id===flP);const pole=table.find(r=>r.grid_pole);
      if(race.official===false)add(body,`<div class="notice">Corrida especial — comemoração ao <strong>Dia dos Pais</strong>.</div>`);
      add(body,`<div class="mini-stats"><span>${esc(race.venue)}${race.track?" · "+esc(race.track):""}</span><span>Kart <b>${hpLabel(race.hp)}</b></span>
        ${race.official===false?"":`<span>Pole <span class="g">${pole?esc(surname(pole.pilot)):"—"}</span></span>`}
        <span>Volta mais rápida <span class="g">${flRow?esc(surname(flRow.pilot)):"—"}</span> ${flRow?KartGP.msToTime(flRow.best_lap_ms):""}</span></div>`);
      add(body,`<h2 class="section-title">Pódio da etapa</h2>`);
      add(body,podium5(table,r=>surname(r.pilot),r=>r.finish_pos!=null?r.finish_pos+"º":"DNF"));
      const rows=table.map(r=>{const p=r.points;const sem=KartGP.semaphoreRacePosition(r.finish_pos,fs);
        const pl=r.finish_pos==null?`<span class="badge dnf">DNF</span>`:`<span class="pos">${r.finish_pos}</span>`;const pod=r.finish_pos&&r.finish_pos<=5?`podium-${r.finish_pos}`:"";
        return `<tr class="${pod}"><td class="num">${pl}</td>
          <td class="pilot-name">${esc(r.pilot.name)} ${p.is_pole?'<span class="badge pole">Pole</span>':""} ${p.is_fastest?'<span class="badge fl">V. Rápida</span>':""}</td>
          <td class="num">#${r.kart_number}</td><td class="num">${KartGP.msToTime(r.best_lap_ms)}</td><td class="num">${r.laps_completed??"—"}</td>
          <td class="num">${esc(r.gap_display)}</td><td class="num sem-cell ${sem}"><span class="dot ${sem}"></span></td></tr>`;}).join("");
      add(body,`<h2 class="section-title">Resultado completo</h2><div class="table-wrap"><table><thead><tr><th class="num">Pos</th><th>Piloto</th><th class="num">Kart</th>
        <th class="num">Melhor volta</th><th class="num">Voltas</th><th class="num">Gap</th><th class="num">Nível</th></tr></thead><tbody>${rows}</tbody></table></div>`);
      add(body,`<div class="legend"><span><span class="dot sem-good"></span>Terço da frente</span><span><span class="dot sem-mid"></span>Meio do grid</span><span><span class="dot sem-bad"></span>Fundo / DNF</span></div>`);
    }
    root.querySelector("#raceSelect").addEventListener("change",e=>draw(e.target.value));
    draw(db.races.slice().sort((a,b)=>b.round-a.round)[0].race_id);
  }

  /* -------- PILOTO (sem rank nem pontos) -------- */
  function renderPilot(root){
    add(root,`<h2 class="section-title">Retrato individual</h2>`);
    add(root,`<div class="sub">Escolha um piloto e o recorte: temporada inteira ou uma corrida específica. Desempenho pessoal, corrida a corrida.</div>`);
    const ps=db.pilots.slice().sort((a,b)=>a.name.localeCompare(b.name));
    add(root,`<div class="controls">
      <div class="field"><label>Piloto</label><select id="pilotSelect">${ps.map(p=>`<option value="${p.pilot_id}">${esc(p.name)}</option>`).join("")}</select></div>
      <div class="field"><label>Recorte</label><select id="viewSelect"></select></div></div>`);
    add(root,`<div id="pilotBody"></div>`);
    const pilotSelect=root.querySelector("#pilotSelect"),viewSelect=root.querySelector("#viewSelect"),body=root.querySelector("#pilotBody");
    function refreshOpts(port){viewSelect.innerHTML=[`<option value="season">Temporada</option>`].concat(port.rows.map(r=>`<option value="${r.race_id}">Etapa ${r.race.round} · ${r.race.date.split("-").reverse().join("/")}</option>`)).join("");}
    function drawSeason(port){
      body.innerHTML="";const s=port.season,p=port.pilot;
      const ps2=port.rows.filter(r=>r.finish_pos!=null).map(r=>r.finish_pos);const avg=ps2.length?ps2.reduce((a,b)=>a+b,0)/ps2.length:null;
      const best=ps2.length?Math.min(...ps2):null;
      add(body,`<h2 class="section-title">${esc(p.name)} ${p.nickname?`— “${esc(p.nickname)}”`:""}</h2><div class="sub">${bondBadge(p)} &nbsp; Desempenho na temporada ${cfg.season}</div>`);
      add(body,`<div class="cards">
        <div class="card"><div class="label">Provas</div><div class="value white">${s?s.played:0}</div></div>
        <div class="card"><div class="label">Melhor resultado</div><div class="value">${best?best+"º":"—"}</div></div>
        <div class="card"><div class="label">Vitórias</div><div class="value white">${s?s.wins:0}</div></div>
        <div class="card"><div class="label">Poles</div><div class="value white">${s?s.poles:0}</div></div>
        <div class="card"><div class="label">Voltas rápidas</div><div class="value white">${s?s.fastest_laps:0}</div></div>
        <div class="card"><div class="label">Melhor volta pessoal</div><div class="value" style="font-size:22px">${KartGP.msToTime(port.best_lap_ms)}</div></div></div>`);
      if(window.Chart){add(body,`<div class="chart-box"><div class="chart-title">Sua evolução — posição por etapa</div><div class="chart-wrap"><canvas id="pilotChart" role="img" aria-label="Evolução de posição do piloto"></canvas></div></div>`);drawPilotChart(port.pilot.pilot_id);}
      add(body,`<h2 class="section-title">Corrida a corrida</h2><div class="sub">Semáforo compara cada etapa à sua média de posição (${avg?avg.toFixed(1)+"º":"—"}).</div>`);
      const rows=port.rows.map(r=>{const sem=KartGP.semaphoreVsSelf(r.finish_pos,avg);const pl=r.finish_pos==null?`<span class="badge dnf">DNF</span>`:`<span class="pos">${r.finish_pos}º</span>`;
        return `<tr><td class="num">${r.race.round}</td><td>${r.race.date.split("-").reverse().join("/")} · ${esc(r.race.venue)}</td>
          <td class="num">${pl} ${r.points.is_pole?'<span class="badge pole">Pole</span>':""} ${r.points.is_fastest?'<span class="badge fl">V.R.</span>':""}</td>
          <td class="num">${KartGP.msToTime(r.best_lap_ms)}</td><td class="num">${hpLabel(db.races.find(x=>x.race_id===r.race_id).hp)}</td>
          <td class="num sem-cell ${sem}"><span class="dot ${sem}"></span></td></tr>`;}).join("");
      add(body,`<div class="table-wrap"><table><thead><tr><th class="num">Et.</th><th>Corrida</th><th class="num">Pos</th><th class="num">Melhor volta</th><th class="num">Kart</th><th class="num">vs média</th></tr></thead><tbody>${rows||`<tr><td colspan="6" class="empty">Sem resultados ainda.</td></tr>`}</tbody></table></div>`);
    }
    function drawRace(port,raceId){
      body.innerHTML="";const r=port.rows.find(x=>x.race_id===raceId),p=port.pilot;
      if(!r){add(body,`<div class="empty">${esc(p.name)} não correu esta etapa.</div>`);return;}
      const full=KartGP.raceTable(db,raceId);const sem=KartGP.semaphoreRacePosition(r.finish_pos,full.length);
      add(body,`<h2 class="section-title">${esc(p.name)} — ${r.race.official===false?"Especial":"Etapa "+r.race.round}</h2><div class="sub">${r.race.date.split("-").reverse().join("/")} · ${esc(r.race.venue)}${r.race.track?" · "+esc(r.race.track):""} · ${hpLabel(r.race.hp)}</div>`);
      add(body,`<div class="cards">
        <div class="card"><div class="label">Resultado</div><div class="value ${sem}">${r.finish_pos==null?"DNF":r.finish_pos+"º"}</div></div>
        <div class="card"><div class="label">Melhor volta</div><div class="value" style="font-size:22px">${KartGP.msToTime(r.best_lap_ms)}</div></div>
        <div class="card"><div class="label">Voltas</div><div class="value white">${r.laps_completed??"—"}</div></div>
        <div class="card"><div class="label">Gap p/ líder</div><div class="value white" style="font-size:18px">${esc(r.gap_display)}</div></div></div>`);
      add(body,`<div class="notice">${r.points.is_pole?"Cravou a <strong>pole</strong>. ":""}${r.points.is_fastest?"Fez a <strong>volta mais rápida</strong> da corrida. ":""}Posição ${r.finish_pos==null?"não classificado":r.finish_pos+"º"} entre ${full.length} pilotos.</div>`);
    }
    function load(){const port=KartGP.pilotPortrait(db,pilotSelect.value);refreshOpts(port);viewSelect.value="season";drawSeason(port);}
    pilotSelect.addEventListener("change",load);
    viewSelect.addEventListener("change",()=>{const port=KartGP.pilotPortrait(db,pilotSelect.value);viewSelect.value==="season"?drawSeason(port):drawRace(port,viewSelect.value);});
    load();
  }

  /* -------- GRÁFICO (posição por etapa, sem pontos) -------- */
  const CHART_COMMON={responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
    scales:{x:{ticks:{color:"#9A968C"},grid:{color:"#2E2E31"}},y:{ticks:{color:"#9A968C",precision:0},grid:{color:"#2E2E31"},reverse:true}}};
  let pilotC;
  function rounds(){return db.races.slice().sort((a,b)=>a.round-b.round);}
  function drawPilotChart(pilotId){
    const cv=document.getElementById("pilotChart");if(!cv)return;if(pilotC)pilotC.destroy();
    const rs=rounds();const labels=rs.map(r=>"Et. "+r.round);
    const data=rs.map(r=>{const res=db.results.find(x=>x.race_id===r.race_id&&x.pilot_id===pilotId);return res&&res.finish_pos!=null?res.finish_pos:null;});
    pilotC=new Chart(cv,{type:"line",data:{labels,datasets:[{label:"Posição",data,borderColor:"#C9A227",backgroundColor:"#C9A227",tension:.25,borderWidth:2,pointRadius:5,spanGaps:true}]},options:CHART_COMMON});
  }

  buildChrome("corrida");setView("corrida");
})();
</script></body></html>
