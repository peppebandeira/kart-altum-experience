<title>Kart Altum Experience</title>

<style>
:root{
  --black:#0B0B0C;
  --surface:#1A1A1C;
  --surface-2:#232326;
  --gold:#C9A227;
  --gold-hi:#E8C558;
  --gold-lo:#8A6E1E;
  --white:#FFFFFF;
  --muted:#9A968C;
  --line:#2E2E31;
  --navy:#0A1628;
  --sem-good:#2E7D32;
  --sem-mid:#E0A800;
  --sem-bad:#C0392B;
  --font-display:"Saira Condensed","Oswald","Arial Narrow",sans-serif;
  --font-sans:Arial,Helvetica,sans-serif;
  --font-serif:Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--black);
  color:var(--white);
  font-family:var(--font-sans);
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
a{color:inherit;text-decoration:none}
.checker{
  height:10px;
  background:
    repeating-conic-gradient(var(--white) 0% 25%, transparent 0% 50%) 0/20px 20px,
    var(--gold);
  opacity:.9;
}
header.top{
  background:linear-gradient(180deg,#111 0%,var(--black) 100%);
  border-bottom:1px solid var(--line);
  padding:18px 20px 14px;
}
.brand-row{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;max-width:1200px;margin:0 auto}
.brand h1{
  font-family:var(--font-display);
  font-style:italic;
  font-weight:700;
  letter-spacing:.5px;
  font-size:30px;
  line-height:1;
  text-transform:uppercase;
}
.brand h1 .k{color:var(--gold)}
.brand .edition{
  font-family:var(--font-sans);font-weight:700;font-size:11px;letter-spacing:3px;
  color:var(--gold);text-transform:uppercase;
}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap}
nav.tabs a{
  font-weight:700;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;
  padding:9px 14px;border:1px solid var(--line);border-radius:6px;color:var(--muted);
  transition:.15s;
}
nav.tabs a:hover{color:var(--white);border-color:var(--gold-lo)}
nav.tabs a.active{color:var(--black);background:var(--gold);border-color:var(--gold)}
main{max-width:1200px;margin:0 auto;padding:26px 20px 60px}
.section-title{
  font-family:var(--font-display);font-style:italic;font-weight:700;text-transform:uppercase;
  font-size:22px;letter-spacing:.5px;margin:6px 0 14px;display:flex;align-items:center;gap:10px;
}
.section-title::before{content:"";width:26px;height:12px;
  background:repeating-conic-gradient(var(--white) 0% 25%, transparent 0% 50%) 0/6px 6px;}
.sub{color:var(--muted);font-size:13px;margin-bottom:18px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.card .label{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
.card .value{font-family:var(--font-display);font-weight:700;font-size:30px;color:var(--gold);margin-top:4px;line-height:1}
.card .value.white{color:var(--white)}
.card .value small{font-size:14px;color:var(--muted);font-family:var(--font-sans);font-weight:400}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
thead th{
  background:var(--surface-2);color:var(--muted);text-transform:uppercase;letter-spacing:1px;
  font-size:11px;text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap;
}
tbody td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:#141416}
td.num,th.num{text-align:center;font-variant-numeric:tabular-nums}
.pos{font-family:var(--font-display);font-weight:700;font-size:17px}
.pilot-name{font-weight:700}
.pilot-name small{display:block;color:var(--muted);font-weight:400;font-size:11px}
.pts{font-family:var(--font-display);font-weight:700;font-size:18px;color:var(--gold)}
tr.podium-1 td:first-child{box-shadow:inset 3px 0 0 var(--gold)}
tr.podium-2 td:first-child{box-shadow:inset 3px 0 0 #C0C0C0}
tr.podium-3 td:first-child{box-shadow:inset 3px 0 0 #CD7F32}
.badge{display:inline-block;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;
  padding:3px 7px;border-radius:4px;margin-left:5px;vertical-align:middle}
.badge.pole{background:var(--gold);color:var(--black)}
.badge.fl{background:transparent;color:var(--gold-hi);border:1px solid var(--gold-lo)}
.badge.dnf{background:#3a1e1e;color:#e88}
.badge.bond{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:middle}
.sem-good{color:var(--sem-good)} .sem-good .dot,.dot.sem-good{background:var(--sem-good)}
.sem-mid{color:var(--sem-mid)} .sem-mid .dot,.dot.sem-mid{background:var(--sem-mid)}
.sem-bad{color:var(--sem-bad)} .sem-bad .dot,.dot.sem-bad{background:var(--sem-bad)}
td.sem-cell{font-weight:700;font-variant-numeric:tabular-nums}
.controls{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
select,input,textarea{
  background:var(--surface);color:var(--white);border:1px solid var(--line);border-radius:8px;
  padding:11px 12px;font-family:var(--font-sans);font-size:14px;min-width:220px;
}
select:focus,input:focus,textarea:focus{outline:none;border-color:var(--gold)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.form-grid .full{grid-column:1/-1}
.form-grid .field{gap:7px}
.hint{font-size:12px;color:var(--muted)}
.btn{
  display:inline-flex;align-items:center;gap:10px;cursor:pointer;
  background:linear-gradient(180deg,var(--gold-hi),var(--gold) 55%,var(--gold-lo));
  color:var(--black);font-weight:700;letter-spacing:2px;text-transform:uppercase;font-size:14px;
  border:none;border-radius:8px;padding:14px 26px;
}
.btn::before{content:"\00bb\00bb";font-weight:700}
.notice{background:#141416;border:1px solid var(--line);border-left:3px solid var(--gold);
  border-radius:8px;padding:12px 14px;color:var(--muted);font-size:13px;margin:14px 0}
footer{border-top:1px solid var(--line);margin-top:40px;padding:26px 20px;text-align:center}
footer .altum{font-family:var(--font-serif);font-size:26px;letter-spacing:6px;color:var(--white)}
footer .tagline{font-family:var(--font-serif);font-style:italic;color:var(--gold);font-size:14px;margin-top:2px}
footer .meta{color:var(--muted);font-size:11px;margin-top:10px;letter-spacing:1px}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--muted)}
.legend span{display:flex;align-items:center}
.empty{color:var(--muted);padding:20px;text-align:center}
@media (max-width:560px){
  .brand h1{font-size:24px}
  main{padding:20px 14px 50px}
}

const KartGP = (function () {

  function msToTime(ms) {
    if (ms == null) return "—";
    const totalSec = ms / 1000;
    const m = Math.floor(totalSec / 60);
    const s = (totalSec - m * 60).toFixed(3).padStart(6, "0");
    return (m > 0 ? m + ":" : "0:") + s;
  }

  function fastestLapPilot(db, raceId) {
    const rows = db.results.filter(r => r.race_id === raceId && r.best_lap_ms != null);
    if (!rows.length) return null;
    return rows.reduce((a, b) => (b.best_lap_ms < a.best_lap_ms ? b : a)).pilot_id;
  }

  function pointsForResult(db, result) {
    const cfg = db.config;
    const table = cfg.points_by_position;
    const flPilot = fastestLapPilot(db, result.race_id);

    const position = (result.finish_pos && result.finish_pos >= 1 && result.finish_pos <= table.length)
      ? table[result.finish_pos - 1] : 0;
    const presence = cfg.presence_points;
    const fastest = (result.pilot_id === flPilot) ? cfg.fastest_lap_points : 0;
    const pole = result.grid_pole ? cfg.pole_points : 0;

    return {
      position, presence, fastest, pole,
      total: position + presence + fastest + pole,
      is_fastest: fastest > 0,
      is_pole: pole > 0
    };
  }

  function raceTable(db, raceId) {
    const rows = db.results.filter(r => r.race_id === raceId).map(r => {
      const pilot = db.pilots.find(p => p.pilot_id === r.pilot_id) || { name: r.pilot_id };
      return { ...r, pilot, points: pointsForResult(db, r) };
    });
    rows.sort((a, b) => {
      if (a.finish_pos == null && b.finish_pos == null) return 0;
      if (a.finish_pos == null) return 1;
      if (b.finish_pos == null) return -1;
      return a.finish_pos - b.finish_pos;
    });
    return rows;
  }

  function championship(db) {
    const cfg = db.config;
    const keep = Math.max(1, cfg.total_rounds - cfg.discard_worst);

    const byPilot = {};
    db.results.forEach(r => {
      const pts = pointsForResult(db, r).total;
      if (!byPilot[r.pilot_id]) byPilot[r.pilot_id] = [];
      byPilot[r.pilot_id].push({ race_id: r.race_id, points: pts, finish_pos: r.finish_pos });
    });

    const standings = Object.keys(byPilot).map(pid => {
      const races = byPilot[pid];
      const played = races.length;
      const sorted = [...races].sort((a, b) => b.points - a.points);
      const kept = sorted.slice(0, Math.min(played, keep));
      const total = kept.reduce((s, x) => s + x.points, 0);
      const grossTotal = races.reduce((s, x) => s + x.points, 0);

      const pilot = db.pilots.find(p => p.pilot_id === pid) || { name: pid };
      const wins = races.filter(x => x.finish_pos === 1).length;
      const poles = db.results.filter(r => r.pilot_id === pid && r.grid_pole).length;
      const fastest = db.races.filter(rc => fastestLapPilot(db, rc.race_id) === pid).length;

      return {
        pilot_id: pid, pilot, played, total, grossTotal,
        dropped_points: grossTotal - total,
        wins, poles, fastest_laps: fastest
      };
    });

    standings.sort((a, b) =>
      b.total - a.total || b.wins - a.wins || b.poles - a.poles || b.fastest_laps - a.fastest_laps
    );
    standings.forEach((s, i) => s.rank = i + 1);
    return standings;
  }

  function pilotPortrait(db, pilotId) {
    const pilot = db.pilots.find(p => p.pilot_id === pilotId);
    const rows = db.results.filter(r => r.pilot_id === pilotId).map(r => {
      const race = db.races.find(rc => rc.race_id === r.race_id);
      return { ...r, race, points: pointsForResult(db, r) };
    });
    rows.sort((a, b) => (a.race?.round || 0) - (b.race?.round || 0));

    const standings = championship(db);
    const me = standings.find(s => s.pilot_id === pilotId);
    const bestLap = rows.reduce((best, r) =>
      (r.best_lap_ms != null && (best == null || r.best_lap_ms < best)) ? r.best_lap_ms : best, null);

    return { pilot, rows, season: me, best_lap_ms: bestLap };
  }

  function semaphoreRacePosition(finishPos, fieldSize) {
    if (finishPos == null) return "sem-bad";
    const t = fieldSize / 3;
    if (finishPos <= t) return "sem-good";
    if (finishPos <= 2 * t) return "sem-mid";
    return "sem-bad";
  }

  function semaphoreVsSelf(finishPos, avgPos) {
    if (finishPos == null || avgPos == null) return "sem-bad";
    if (finishPos <= avgPos - 1) return "sem-good";
    if (finishPos >= avgPos + 1) return "sem-bad";
    return "sem-mid";
  }

  function semaphoreRank(rank, total) {
    const t = total / 3;
    if (rank <= t) return "sem-good";
    if (rank <= 2 * t) return "sem-mid";
    return "sem-bad";
  }

  return {
    msToTime, fastestLapPilot, pointsForResult, raceTable,
    championship, pilotPortrait,
    semaphoreRacePosition, semaphoreVsSelf, semaphoreRank
  };
})();

<script>
(function () {
  const db = window.__DB__;
  const cfg = db.config;
  const VIEWS = [
    { key: "campeonato", label: "Campeonato" },
    { key: "corrida", label: "Corridas" },
    { key: "piloto", label: "Pilotos" },
    { key: "cadastro", label: "Cadastro" }
  ];
  function el(html){const t=document.createElement("template");t.innerHTML=html.trim();return t.content.firstChild;}
  function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
  function bondBadge(p){const l=cfg.bond_labels[p.bond_type]||p.bond_type;return `<span class="badge bond">${esc(l)}</span>`;}

  function buildChrome(active){
    document.querySelectorAll(".kae-chrome").forEach(n=>n.remove());
    const header = el(`<div class="kae-chrome">
      <div class="checker"></div>
      <header class="top"><div class="brand-row">
        <div class="brand"><div class="edition">${esc(cfg.edition)} · ${cfg.season}</div>
        <h1><span class="k">KART</span> ALTUM EXPERIENCE</h1></div>
        <nav class="tabs">${VIEWS.map(v=>`<a href="#" data-view="${v.key}" class="${v.key===active?"active":""}">${v.label}</a>`).join("")}</nav>
      </div></header></div>`);
    document.body.prepend(header);
    header.querySelectorAll("a[data-view]").forEach(a=>{
      a.addEventListener("click",e=>{e.preventDefault();setView(a.getAttribute("data-view"));});
    });
    let f=document.querySelector(".kae-foot");
    if(!f){f=el(`<footer class="kae-foot"><div class="altum">ALTUM</div><div class="tagline">${esc(cfg.tagline)}</div>
      <div class="meta">${esc(cfg.championship)} · Temporada ${cfg.season} · Pontuação Altum GP · best ${cfg.total_rounds-cfg.discard_worst} de ${cfg.total_rounds}</div></footer>`);
      document.body.appendChild(f);}
  }

  function setView(view){
    buildChrome(view);
    const root=document.getElementById("app");root.innerHTML="";
    if(view==="campeonato")renderChampionship(root);
    else if(view==="corrida")renderRace(root);
    else if(view==="piloto")renderPilot(root);
    else if(view==="cadastro")renderCadastro(root);
    window.scrollTo(0,0);
  }

  function renderChampionship(root){
    const st=KartGP.championship(db);const leader=st[0];
    const fk=[...st].sort((a,b)=>b.fastest_laps-a.fastest_laps)[0];
    root.appendChild(el(`<div class="cards">
      <div class="card"><div class="label">Etapas rodadas</div><div class="value white">${db.races.length}<small> / ${cfg.total_rounds}</small></div></div>
      <div class="card"><div class="label">Pilotos</div><div class="value white">${db.pilots.length}</div></div>
      <div class="card"><div class="label">Líder</div><div class="value">${esc(leader?leader.pilot.name.split(" ")[0]:"—")}</div></div>
      <div class="card"><div class="label">Rei da volta rápida</div><div class="value">${fk&&fk.fastest_laps?esc(fk.pilot.name.split(" ")[0]):"—"}</div></div>
    </div>`));
    root.appendChild(el(`<h2 class="section-title">Classificação geral</h2>`));
    root.appendChild(el(`<div class="sub">Contam as <strong>${cfg.total_rounds-cfg.discard_worst} melhores de ${cfg.total_rounds}</strong> etapas. Semáforo pela posição no pelotão.</div>`));
    const rows=st.map(s=>{const sem=KartGP.semaphoreRank(s.rank,st.length);const pod=s.rank<=3?`podium-${s.rank}`:"";
      return `<tr class="${pod}"><td class="num"><span class="pos">${s.rank}</span></td>
        <td class="pilot-name">${esc(s.pilot.name)} ${s.pilot.nickname?`<small>“${esc(s.pilot.nickname)}”</small>`:""}</td>
        <td>${bondBadge(s.pilot)}</td><td class="num pts">${s.total}</td><td class="num">${s.played}</td>
        <td class="num">${s.wins||"—"}</td><td class="num">${s.poles||"—"}</td><td class="num">${s.fastest_laps||"—"}</td>
        <td class="num sem-cell ${sem}"><span class="dot ${sem}"></span></td></tr>`;}).join("");
    root.appendChild(el(`<div class="table-wrap"><table><thead><tr><th class="num">#</th><th>Piloto</th><th>Vínculo</th>
      <th class="num">Pontos</th><th class="num">Provas</th><th class="num">Vit.</th><th class="num">Poles</th><th class="num">V.Rápida</th><th class="num">Nível</th></tr></thead>
      <tbody>${rows}</tbody></table></div>`));
    root.appendChild(el(`<div class="legend"><span><span class="dot sem-good"></span>Topo do pelotão</span><span><span class="dot sem-mid"></span>Meio</span><span><span class="dot sem-bad"></span>Fundo</span></div>`));
  }

  function renderRace(root){
    root.appendChild(el(`<h2 class="section-title">Resultado por etapa</h2>`));
    root.appendChild(el(`<div class="sub">Escolha a corrida. Cálculo de pontos aberto por piloto; semáforo pela posição no grid do dia.</div>`));
    const sel=el(`<div class="controls"><div class="field"><label>Etapa</label>
      <select id="raceSelect">${db.races.slice().sort((a,b)=>b.round-a.round).map(r=>`<option value="${r.race_id}">Etapa ${r.round} · ${r.date.split("-").reverse().join("/")} · ${esc(r.venue)}</option>`).join("")}</select></div></div>`);
    root.appendChild(sel);const body=el(`<div id="raceBody"></div>`);root.appendChild(body);
    function draw(raceId){
      body.innerHTML="";const race=db.races.find(r=>r.race_id===raceId);const table=KartGP.raceTable(db,raceId);
      const fs=table.length;const flP=KartGP.fastestLapPilot(db,raceId);const flRow=table.find(r=>r.pilot_id===flP);
      const win=table.find(r=>r.finish_pos===1);const pole=table.find(r=>r.grid_pole);
      body.appendChild(el(`<div class="cards">
        <div class="card"><div class="label">Local</div><div class="value white" style="font-size:18px">${esc(race.venue)}</div><div class="hint">${esc(race.track)} · ${esc(race.layout)}</div></div>
        <div class="card"><div class="label">Kart</div><div class="value">${race.hp}<small> HP</small></div></div>
        <div class="card"><div class="label">Vencedor</div><div class="value" style="font-size:20px">${esc(win?win.pilot.name.split(" ")[0]:"—")}</div></div>
        <div class="card"><div class="label">Pole</div><div class="value" style="font-size:20px">${esc(pole?pole.pilot.name.split(" ")[0]:"—")}</div></div>
        <div class="card"><div class="label">Volta mais rápida</div><div class="value" style="font-size:20px">${esc(flRow?flRow.pilot.name.split(" ")[0]:"—")}</div><div class="hint">${flRow?KartGP.msToTime(flRow.best_lap_ms):""}</div></div></div>`));
      const rows=table.map(r=>{const p=r.points;const sem=KartGP.semaphoreRacePosition(r.finish_pos,fs);
        const pl=r.finish_pos==null?`<span class="badge dnf">DNF</span>`:`<span class="pos">${r.finish_pos}</span>`;const pod=r.finish_pos&&r.finish_pos<=3?`podium-${r.finish_pos}`:"";
        return `<tr class="${pod}"><td class="num">${pl}</td>
          <td class="pilot-name">${esc(r.pilot.name)} ${p.is_pole?'<span class="badge pole">Pole</span>':""} ${p.is_fastest?'<span class="badge fl">V. Rápida</span>':""}</td>
          <td class="num">#${r.kart_number}</td><td class="num">${KartGP.msToTime(r.best_lap_ms)}</td><td class="num">${r.laps_completed??"—"}</td>
          <td class="num">${esc(r.gap_display)}</td><td class="num" style="color:var(--muted)">${p.position}+${p.presence}${p.pole?"+"+p.pole:""}${p.fastest?"+"+p.fastest:""}</td>
          <td class="num pts">${p.total}</td><td class="num sem-cell ${sem}"><span class="dot ${sem}"></span></td></tr>`;}).join("");
      body.appendChild(el(`<div class="table-wrap"><table><thead><tr><th class="num">Pos</th><th>Piloto</th><th class="num">Kart</th>
        <th class="num">Melhor volta</th><th class="num">Voltas</th><th class="num">Gap</th><th class="num">Cálculo</th><th class="num">Pontos</th><th class="num">Nível</th></tr></thead><tbody>${rows}</tbody></table></div>`));
      body.appendChild(el(`<div class="legend"><span><span class="dot sem-good"></span>Terço da frente</span><span><span class="dot sem-mid"></span>Meio do grid</span><span><span class="dot sem-bad"></span>Fundo / DNF</span></div>`));
    }
    sel.querySelector("#raceSelect").addEventListener("change",e=>draw(e.target.value));
    draw(db.races.slice().sort((a,b)=>b.round-a.round)[0].race_id);
  }

  function renderPilot(root){
    root.appendChild(el(`<h2 class="section-title">Retrato individual</h2>`));
    root.appendChild(el(`<div class="sub">Escolha um piloto e o recorte: temporada inteira ou uma corrida específica. Transparência total — qualquer piloto pode ver os dados de qualquer outro.</div>`));
    const ps=db.pilots.slice().sort((a,b)=>a.name.localeCompare(b.name));
    const ctr=el(`<div class="controls">
      <div class="field"><label>Piloto</label><select id="pilotSelect">${ps.map(p=>`<option value="${p.pilot_id}">${esc(p.name)}</option>`).join("")}</select></div>
      <div class="field"><label>Recorte</label><select id="viewSelect"><option value="season">Retrato de campeonato</option></select></div></div>`);
    root.appendChild(ctr);const body=el(`<div id="pilotBody"></div>`);root.appendChild(body);
    const pilotSelect=ctr.querySelector("#pilotSelect");const viewSelect=ctr.querySelector("#viewSelect");
    function refreshOpts(port){viewSelect.innerHTML=[`<option value="season">Retrato de campeonato</option>`].concat(port.rows.map(r=>`<option value="${r.race_id}">Etapa ${r.race.round} · ${r.race.date.split("-").reverse().join("/")}</option>`)).join("");}
    function drawSeason(port){
      body.innerHTML="";const s=port.season;const p=port.pilot;
      const ps2=port.rows.filter(r=>r.finish_pos!=null).map(r=>r.finish_pos);const avg=ps2.length?ps2.reduce((a,b)=>a+b,0)/ps2.length:null;
      body.appendChild(el(`<h2 class="section-title">${esc(p.name)} ${p.nickname?`— “${esc(p.nickname)}”`:""}</h2>
        <div class="sub">${bondBadge(p)} &nbsp; Retrato da temporada ${cfg.season}</div>
        <div class="cards">
          <div class="card"><div class="label">Posição no campeonato</div><div class="value">${s?s.rank+"º":"—"}</div></div>
          <div class="card"><div class="label">Pontos (contam)</div><div class="value">${s?s.total:0}</div><div class="hint">${s&&s.dropped_points?"descartados: "+s.dropped_points:"sem descarte"}</div></div>
          <div class="card"><div class="label">Provas</div><div class="value white">${s?s.played:0}</div></div>
          <div class="card"><div class="label">Vitórias</div><div class="value white">${s?s.wins:0}</div></div>
          <div class="card"><div class="label">Poles</div><div class="value white">${s?s.poles:0}</div></div>
          <div class="card"><div class="label">Voltas rápidas</div><div class="value white">${s?s.fastest_laps:0}</div></div>
          <div class="card"><div class="label">Melhor volta pessoal</div><div class="value" style="font-size:22px">${KartGP.msToTime(port.best_lap_ms)}</div></div></div>`));
      body.appendChild(el(`<h2 class="section-title">Corrida a corrida</h2>`));
      body.appendChild(el(`<div class="sub">Semáforo compara cada etapa à sua média de posição (${avg?avg.toFixed(1)+"º":"—"}).</div>`));
      const rows=port.rows.map(r=>{const sem=KartGP.semaphoreVsSelf(r.finish_pos,avg);const pl=r.finish_pos==null?`<span class="badge dnf">DNF</span>`:`<span class="pos">${r.finish_pos}º</span>`;
        return `<tr><td class="num">${r.race.round}</td><td>${r.race.date.split("-").reverse().join("/")} · ${esc(r.race.venue)}</td>
          <td class="num">${pl} ${r.points.is_pole?'<span class="badge pole">Pole</span>':""} ${r.points.is_fastest?'<span class="badge fl">V.R.</span>':""}</td>
          <td class="num">${KartGP.msToTime(r.best_lap_ms)}</td><td class="num">${db.races.find(x=>x.race_id===r.race_id).hp} HP</td>
          <td class="num pts">${r.points.total}</td><td class="num sem-cell ${sem}"><span class="dot ${sem}"></span></td></tr>`;}).join("");
      body.appendChild(el(`<div class="table-wrap"><table><thead><tr><th class="num">Et.</th><th>Corrida</th><th class="num">Pos</th><th class="num">Melhor volta</th><th class="num">Kart</th><th class="num">Pontos</th><th class="num">vs média</th></tr></thead><tbody>${rows||`<tr><td colspan="7" class="empty">Sem resultados ainda.</td></tr>`}</tbody></table></div>`));
    }
    function drawRace(port,raceId){
      body.innerHTML="";const r=port.rows.find(x=>x.race_id===raceId);const p=port.pilot;
      if(!r){body.appendChild(el(`<div class="empty">Piloto não correu esta etapa.</div>`));return;}
      const full=KartGP.raceTable(db,raceId);const sem=KartGP.semaphoreRacePosition(r.finish_pos,full.length);
      body.appendChild(el(`<h2 class="section-title">${esc(p.name)} — Etapa ${r.race.round}</h2>
        <div class="sub">${r.race.date.split("-").reverse().join("/")} · ${esc(r.race.venue)} · ${esc(r.race.track)} · ${r.race.hp} HP</div>
        <div class="cards">
          <div class="card"><div class="label">Resultado</div><div class="value ${sem}">${r.finish_pos==null?"DNF":r.finish_pos+"º"}</div></div>
          <div class="card"><div class="label">Melhor volta</div><div class="value" style="font-size:22px">${KartGP.msToTime(r.best_lap_ms)}</div></div>
          <div class="card"><div class="label">Voltas</div><div class="value white">${r.laps_completed??"—"}</div></div>
          <div class="card"><div class="label">Gap p/ líder</div><div class="value white" style="font-size:18px">${esc(r.gap_display)}</div></div>
          <div class="card"><div class="label">Pontos na etapa</div><div class="value">${r.points.total}</div><div class="hint">${r.points.position} pos + ${r.points.presence} pres${r.points.pole?` + ${r.points.pole} pole`:""}${r.points.fastest?` + ${r.points.fastest} v.rápida`:""}</div></div></div>
        <div class="notice">${r.points.is_pole?"cravou a <strong>pole</strong>. ":""}${r.points.is_fastest?"fez a <strong>volta mais rápida</strong> da corrida. ":""}Posição ${r.finish_pos==null?"não classificado":r.finish_pos+"º"} entre ${full.length} pilotos.</div>`));
    }
    function load(){const port=KartGP.pilotPortrait(db,pilotSelect.value);refreshOpts(port);viewSelect.value="season";drawSeason(port);
      viewSelect.onchange=()=>{const p2=KartGP.pilotPortrait(db,pilotSelect.value);viewSelect.value==="season"?drawSeason(p2):drawRace(p2,viewSelect.value);};}
    pilotSelect.addEventListener("change",load);load();
  }

  function renderCadastro(root){
    root.appendChild(el(`<h2 class="section-title">Cadastro de piloto</h2>`));
    root.appendChild(el(`<div class="sub">Preencha uma vez. Contato é privado — só a organização ALTUM vê. No ranking aparece só nome/apelido e desempenho.</div>`));
    const form=el(`<form id="pilotForm"><div class="form-grid">
      <div class="field"><label>Nome completo *</label><input name="full_name" required placeholder="Como no documento"></div>
      <div class="field"><label>Apelido de piloto</label><input name="nickname" placeholder="Como quer no ranking"></div>
      <div class="field"><label>CPF *</label><input name="cpf" required inputmode="numeric" placeholder="Identidade única"></div>
      <div class="field"><label>Data de nascimento *</label><input name="birth_date" type="date" required></div>
      <div class="field"><label>Peso (kg) *</label><input name="weight_kg" type="number" min="30" max="200" required placeholder="No kart, peso é performance"></div>
      <div class="field"><label>Cidade</label><input name="city" placeholder="Cidade / UF"></div>
      <div class="field"><label>WhatsApp *</label><input name="phone" required inputmode="tel" placeholder="(61) 90000-0000"></div>
      <div class="field"><label>E-mail</label><input name="email" type="email" placeholder="voce@empresa.com"></div>
      <div class="field"><label>Contato de emergência</label><input name="emergency_contact" placeholder="Nome e telefone"></div>
      <div class="field"><label>Vínculo com a ALTUM *</label><select name="bond_type" id="bondType" required>
        <option value="">Selecione…</option><option value="member">Membro</option><option value="referred">Indicado</option><option value="guest">Convidado</option><option value="member_child">Filho de Membro</option></select></div>
      <div class="field" id="sponsorField" style="display:none"><label>Quem te trouxe (membro ALTUM) *</label><input name="sponsor_member" id="sponsorMember" placeholder="Nome do membro padrinho"><span class="hint">Obrigatório p/ indicado, convidado e filho de membro.</span></div>
      <div class="field full"><label style="display:flex;gap:10px;align-items:flex-start;text-transform:none;letter-spacing:0;font-size:13px;color:var(--white)"><input type="checkbox" name="consent_waiver" required style="min-width:auto;width:18px;height:18px;margin-top:2px">Estou ciente de que o kart envolve risco físico e assumo responsabilidade pela minha participação. *</label></div>
      <div class="field full"><label style="display:flex;gap:10px;align-items:flex-start;text-transform:none;letter-spacing:0;font-size:13px;color:var(--white)"><input type="checkbox" name="consent_image" required style="min-width:auto;width:18px;height:18px;margin-top:2px">Autorizo o uso da minha imagem nos conteúdos do Kart Altum Experience. *</label></div>
    </div>
    <div class="notice" id="statusBox">Seus dados vão para um banco privado da organização. Nome/apelido e desempenho aparecem no ranking; contato não.</div>
    <div style="margin-top:18px"><button type="submit" class="btn" id="submitBtn">Reservar minha vaga</button></div></form>`);
    root.appendChild(form);
    const bond=form.querySelector("#bondType"),sf=form.querySelector("#sponsorField"),sp=form.querySelector("#sponsorMember"),statusBox=form.querySelector("#statusBox"),btn=form.querySelector("#submitBtn");
    bond.addEventListener("change",()=>{const need=bond.value&&bond.value!=="member";sf.style.display=need?"flex":"none";sp.required=need;if(!need)sp.value="";});
    const C=window.KART_CONFIG||{};const has=C.SUPABASE_URL&&C.SUPABASE_ANON_KEY;
    const sb=has&&window.supabase?window.supabase.createClient(C.SUPABASE_URL,C.SUPABASE_ANON_KEY):null;
    form.addEventListener("submit",async e=>{
      e.preventDefault();if(!form.reportValidity())return;const f=new FormData(form);
      const row={full_name:f.get("full_name"),nickname:f.get("nickname")||null,cpf:f.get("cpf")||null,birth_date:f.get("birth_date")||null,
        weight_kg:f.get("weight_kg")?Number(f.get("weight_kg")):null,city:f.get("city")||null,phone:f.get("phone")||null,email:f.get("email")||null,
        emergency_contact:f.get("emergency_contact")||null,bond_type:f.get("bond_type"),sponsor_member:f.get("sponsor_member")||null,
        consent_waiver:!!f.get("consent_waiver"),consent_image:!!f.get("consent_image")};
      if(!sb){statusBox.innerHTML="<strong>Banco não configurado.</strong> Prévia:<br><br>"+Object.entries(row).map(([k,v])=>`${k}: ${v}`).join("<br>");return;}
      btn.disabled=true;btn.textContent="Enviando…";
      const{error}=await sb.from("pilots").insert(row);
      if(error){statusBox.innerHTML="<strong>Não consegui enviar.</strong> "+error.message;btn.disabled=false;btn.textContent="Reservar minha vaga";}
      else{form.querySelectorAll("input,select,button").forEach(x=>x.disabled=true);statusBox.innerHTML="<strong>Cadastro confirmado.</strong> Nos vemos na pista. 🏁";btn.textContent="Confirmado";}
    });
  }

  buildChrome("campeonato");setView("campeonato");
})();
</script>
</body></html>
